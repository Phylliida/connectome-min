[package]
name = "connectome-web"
version = "0.1.0"
edition = "2024"

[dependencies]
connectome = { version = "0.1.0", path = "../connectome" }
include_dir = "0.7.4"
itertools = "0.15.0"
libc = "0.2.191"
open = "5.4.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
smart-default = "0.7.1"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
wait-timeout = "0.2.1"
