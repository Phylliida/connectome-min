<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connectome</title>
<script src="/libs.js"></script>
<link rel="stylesheet" href="/katex.css">
<style>
:root {
  --bg: #f7f6f3; --panel: #ffffff; --ink: #1d1c1a; --muted: #6b6862; --line: #e3e0da;
  --accent: #2f6fdf; --tail: #2f9e6a; --raw: #8a8780; --warn: #c2410c;
  --l1: #c9dcfb; --l2: #a5c4f6; --l3: #7ea8ee; --l4: #5a8de4; --l5: #3d72d6;
  --add: #e6f4ea; --del: #fbe9e7; --kw: #8250df; --str: #0a7a3e; --num: #b35900; --type: #b3006b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161615; --panel: #1f1f1d; --ink: #ecebe7; --muted: #9a978f; --line: #33322f;
    --accent: #6b9cf5; --tail: #4cc38a; --raw: #8f8c85; --warn: #f97316;
    --l1: #23375c; --l2: #2b4778; --l3: #345a97; --l4: #3f6db5; --l5: #4b82d4;
    --add: #1c3326; --del: #3d2224; --kw: #c4a5ff; --str: #7ee2a8; --num: #ffb36b; --type: #ff8fc8;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, sans-serif; }
main { display: grid; grid-template-columns: 220px 1fr 360px; height: 100vh; }
aside, section { overflow: auto; padding: 16px; }
aside { border-right: 1px solid var(--line); }
#memory { border-left: 1px solid var(--line); border-right: 0; }
h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
button, input, textarea, select { font: inherit; color: inherit; }
button { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button:disabled { opacity: .35; cursor: default; border-color: var(--line); }
.icon { display: inline-flex; align-items: center; justify-content: center; padding: 7px; }
.icon svg { width: 20px; height: 20px; }
input, textarea, select { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
input[type=checkbox] { width: auto; }
.settings { display: flex; flex-direction: column; gap: 6px; padding: 0; border: 0; }
.settings label, .settings small, .legend, .msg .who { font-size: 12px; color: var(--muted); }
.top { display: flex; gap: 6px; margin: 0 0 14px; }
.new { flex: 1; padding: 7px 10px; }
.top .icon svg { width: 18px; height: 18px; color: var(--muted); }
.nokey { display: block; margin: -8px 0 14px; color: var(--warn); font-size: 12px; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); padding: 18px 20px; width: min(480px, 92vw); }
dialog::backdrop { background: rgb(0 0 0 / .35); }
dialog .settings { gap: 10px; }
dialog .settings small.warn { color: var(--warn); }
dialog .buttons { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-top: 4px; }
dialog .buttons small { margin-right: auto; }

/* the settings: a card per provider, its models as chips */
#settings { width: min(600px, 94vw); }
#settings > small { display: block; margin: -2px 0 12px; color: var(--muted); font-size: 12px; }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin: 0 0 12px; }
.card.adding { border-style: dashed; }
.card h3 { font-size: 14px; margin: 0; }
.card h3 small { font-weight: normal; color: var(--warn); margin-left: 6px; }
.models { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.model { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; padding: 1px 2px 1px 10px; background: var(--bg); font: 12px ui-monospace, monospace; }
.model button { border: 0; background: none; padding: 0 6px; color: var(--muted); }
.model button:hover { color: var(--warn); }
.models input { flex: 1; width: auto; min-width: 180px; font-size: 12px; }
.card .delete { padding: 5px; color: var(--muted); }
.card .delete svg { width: 17px; height: 17px; }
.card .delete:hover { color: var(--warn); border-color: var(--warn); }

/* the Auto switch, with the session's companion */
.pairing { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; }
.pairing small { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.pairing a { color: var(--accent); }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; font-weight: 600; }
.switch input { appearance: none; position: relative; width: 34px; height: 20px; padding: 0; margin: 0; border-radius: 10px; background: var(--line); border: 0; cursor: pointer; transition: background .15s; }
.switch input::before { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--panel); box-shadow: 0 1px 2px rgb(0 0 0 / .3); transition: left .15s; }
.switch input:checked { background: var(--tail); }
.switch input:checked::before { left: 16px; }
.switch input:disabled { opacity: .4; cursor: default; }

/* the sessions, grouped by workspace */
#sessions a { display: block; padding: 4px 6px; border-radius: 6px; color: inherit; text-decoration: none; }
#sessions a.on { background: var(--panel); outline: 1px solid var(--line); }
#sessions small { color: var(--muted); }
.group { margin: 0 0 6px; }
.group summary { cursor: pointer; padding: 4px 0; list-style: none; }   /* a click on the header folds its group; no arrow */
.group summary::-webkit-details-marker { display: none; }
.group summary small { display: block; font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }

/* the chat: a line where the speaker changes, then each block a bubble, the user's on the right */
#chat { display: flex; flex-direction: column; padding: 0; }
#log { flex: 1; overflow: auto; padding: 16px; }
.msg { position: relative; margin-top: 12px; }
.earlier { text-align: center; font-size: 12px; color: var(--muted); min-height: 18px; overflow-anchor: none; }   /* never what the view keeps in place */
.msg .who { margin-bottom: 4px; }
.msg.more { margin-top: 0; }
.msg.more > .who, #reply.empty { display: none; }
.msg[data-who="user"]:not(.results) { display: flex; flex-direction: column; align-items: flex-end; }
.msg[data-who="user"]:not(.results) .bubble { max-width: 85%; }
.msg.heard .bubble { border-left: 3px solid var(--tail); }   /* from the session's partner: how it came, what it says, what it ran */
.bubble .head, .bubble .ran { font-size: 12px; color: var(--muted); white-space: normal; }
.bubble .head { margin-bottom: 4px; }
.bubble .ran { margin-top: 6px; }
.msg > button { position: absolute; top: 0; right: 0; padding: 2px 5px; display: none; color: var(--muted); }
.msg > button svg { width: 17px; height: 17px; }
.msg[data-who="user"] > button { right: auto; left: 0; }
.msg:hover > button { display: block; }
.fold { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin: 14px 0 2px; }
.fold::before, .fold::after { content: ''; flex: 1; border-top: 1px dashed var(--line); }
.bubble, .thinking, .tool { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; margin: 0 0 6px; }
.bubble { white-space: pre-wrap; word-wrap: break-word; padding: 8px 10px; }
.thinking summary, .tool summary { cursor: pointer; font-size: 12px; list-style: none; }
.thinking summary::-webkit-details-marker, .tool summary::-webkit-details-marker { display: none; }
.tool pre, .md pre, .md code, .cmd, #detail { font: 12px/1.4 ui-monospace, monospace; }

/* reasoning, folded to its last line; while it streams in, its newest lines */
.thinking { border-style: dashed; color: var(--muted); }
.thinking > div { white-space: pre-wrap; font-style: italic; margin-top: 6px; }
.thinking .last { display: inline-block; max-width: calc(100% - 90px); vertical-align: bottom; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-style: italic; margin-left: 6px; }
.thinking[open] .last { display: none; }
.thinking.live > span { font-size: 12px; }
.thinking.live > div { max-height: 7.3em; overflow: hidden; display: flex; flex-direction: column-reverse; }   /* its bottom in view */

/* a call's card, folded to its line, its result joining it */
.tool summary { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tool[open] summary { white-space: pre-wrap; }
.tool[open] summary .out { display: none; }
.tool pre { white-space: pre-wrap; margin: 4px 0; }
.tool.failed summary, .tool pre.failed { color: var(--warn); }
.cmd { color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; }   /* a command in full, folded or not */
.cmd::before { content: '$ '; color: var(--muted); }
.query { color: var(--ink); }
.query svg { width: 13px; height: 13px; vertical-align: -2px; margin-right: 6px; color: var(--muted); }
.ask { display: flex; gap: 6px; margin: 4px 0 6px; }
.tool .running { font-size: 12px; color: var(--accent); margin: 4px 0; }

/* the assistant's text as markdown */
.md { white-space: normal; }
.md .done, .md .tail { display: contents; }   /* a streaming reply's finished blocks, and the rest */
.md > :first-child, .md > :is(.done, .tail):first-child > :first-child { margin-top: 0; }
.md > :last-child, .md > .tail:last-child > :last-child { margin-bottom: 0; }
.md pre, .md code { background: var(--bg); border-radius: 4px; }
.md pre { padding: 8px; overflow: auto; }
.md :not(pre) > code { padding: 1px 4px; }
.md table { border-collapse: collapse; }
.md th, .md td { border: 1px solid var(--line); padding: 2px 8px; }
.md a[href] { color: var(--accent); }
.md blockquote { margin: 0; padding-left: 10px; border-left: 3px solid var(--line); color: var(--muted); }
.md .katex-display { margin: 8px 0; }

/* code as highlight.js colors it, and an edit's diff, its gutter never copied */
.hljs-keyword, .hljs-built_in, .hljs-selector-tag { color: var(--kw); }
.hljs-string, .hljs-regexp, .hljs-char { color: var(--str); }
.hljs-number, .hljs-literal, .hljs-symbol { color: var(--num); }
.hljs-comment, .hljs-quote { color: var(--muted); font-style: italic; }
.hljs-title, .hljs-section { color: var(--accent); }
.hljs-type, .hljs-attr, .hljs-attribute, .hljs-meta, .hljs-variable { color: var(--type); }
.diff > div::before { content: attr(data-n) " " attr(data-mark); display: inline-block; width: 6ch; margin-right: 1ch; text-align: right; color: var(--muted); white-space: pre; }
.diff .add { background: var(--add); }
.diff .del { background: var(--del); }

/* the message box */
form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
form textarea { resize: vertical; min-height: 42px; }
#text { resize: none; max-height: 50vh; }   /* as tall as what's in it (fit), then it scrolls */
#say { align-items: stretch; }   /* its buttons as tall as the message box, which the user can make taller */
#status { color: var(--muted); font-size: 12px; padding: 0 16px 8px; min-height: 18px; }
#status.warn { color: var(--warn); }

/* the session's numbers, its tools, and its memory pyramid */
.stat { display: flex; justify-content: space-between; font-size: 13px; padding: 2px 0; }
.bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 4px 0 12px; }
.bar div { height: 100%; background: var(--accent); }
.chip { font-size: 12px; padding: 0 6px; margin-left: 4px; color: var(--muted); }
.chip.on { border-color: var(--tail); color: var(--tail); }
.pyramid { display: flex; flex-direction: column; gap: 3px; margin: 8px 0 12px; }
.row { position: relative; height: 18px; }
.cell { position: absolute; top: 0; bottom: 0; border-radius: 3px; border: 1px solid transparent; cursor: pointer; min-width: 2px; }
.cell.shown { border-color: var(--ink); }
.row.chunks .cell { background: var(--raw); opacity: .5; }
.row.chunks .cell.shown { opacity: 1; }
pre#detail { white-space: pre-wrap; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px; max-height: 40vh; overflow: auto; }

@media (max-width: 900px) {
  main { grid-template-columns: 1fr; height: auto; }
  #chat { height: 80vh; }
}
</style>
</head>
<body>
<main></main>
<script>
// The page draws itself from what it shows (`page`, and `state`, the session as the server has it),
// which only the actions further down change, each then calling redraw(). Preact draws it: each part
// of the page a component, a function of what the page shows, written with htm.
const { h, render, Component } = preact;
const html = htm.bind(h);
const current = () => decodeURIComponent(location.hash.slice(1));   // the session the page shows

let state = null;   // the session as the server has it (a global the browser tests read)
const page = {
  sessions: [], providers: [],
  messages: [],                           // the log's messages the page has, oldest first
  live: null,                             // the turn running, as the page hears it (follow)
  error: null,                            // why what the page last did failed
  broken: null,                           // why the session's files can't be read as they are
  notes: { session: '' },                 // under the session form: saved, or why not
  tuned: 0,                               // the session form's saves, after each of which it starts again
  picked: null,                           // the provider chosen on the session form, until it starts again
  creating: null,                         // the new-session dialog, while it's open: {workspace chosen, error}
  settings: null,                         // the settings dialog, while it's open: {notes: under each card, by provider ('' the new one's), made: providers added}
  accompanying: null,                     // the dialog that makes the session's companion, while it's open: {error}
  detail: 'Select a memory or chunk.',    // the memory or chunk the pyramid last showed
  folded: new Set(),                      // the workspaces whose groups are folded, kept in this browser
  scroll: false,                          // whether the next draw takes the log to its end, wherever it's scrolled to
  keep: null,                             // the log's height, which the next draw adds what it puts above to (earlier messages, at its very top)
  earlier: null,                          // 'loading' while a page of the log's earlier messages loads
};
let stream = null;   // aborts the stream the page follows its session on

// the page drawn again from what it shows: at once (draw, after what the user does), or at most once a
// frame however fast it changes (redraw, as a turn streams). The log keeps to its end as it grows while
// the user is there (or near it), and stays where they scrolled to otherwise; opening a session or
// sending a message takes it there (page.scroll). Earlier messages put above the view leave it where
// it was, even mid-scroll: the browser keeps what's in view in place (scroll anchoring), except at the
// log's very top, where the draw does (page.keep).
let frame = null;
function draw() {
  cancelAnimationFrame(frame);
  frame = null;
  const log = document.getElementById('log');
  const following = page.scroll || (log && log.scrollHeight - log.scrollTop - log.clientHeight < 48);
  render(html`<${App} />`, document.querySelector('main'));
  const drawn = document.getElementById('log');
  if (page.keep != null) drawn.scrollTop = drawn.scrollHeight - page.keep;
  else if (following) drawn.scrollTop = drawn.scrollHeight;
  [page.scroll, page.keep] = [false, null];
}
const redraw = () => frame ??= requestAnimationFrame(draw);

// a POST as this server takes it: only its own page sends the header
const post = (body, signal) => ({ method: 'POST', headers: { 'x-connectome': '1' }, body: JSON.stringify(body), signal });

async function api(path, body) {
  const v = await (await fetch(path, body ? post(body) : {})).json();
  if (v?.error) throw new Error(v.error);
  return v;
}

// an assistant's text as markdown, its line breaks kept. The HTML keeps only what markdown makes, so
// the model's text can't run code on the page or load anything (an image would tell its server what
// the page shows); its links open in a new tab. Its math and its code go in after, as KaTeX and
// highlight.js made them (keep).
let kept = [];
const keep = (html) => `\uE000${kept.push(html) - 1}\uE001`;
const markdown = (text) => {
  kept = [];
  const html = DOMPurify.sanitize(marked.parse(text, { breaks: true }), {
    ALLOWED_TAGS: ['p', 'br', 'hr', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'strong', 'em', 'del', 'code', 'pre', 'blockquote', 'ul', 'ol', 'li', 'a', 'table', 'thead', 'tbody', 'tr', 'th', 'td', 'input'],
    ALLOWED_ATTR: ['href', 'title', 'start', 'align', 'type', 'checked', 'disabled'],
  });
  return html.replace(/\uE000(\d+)\uE001/g, (_, n) => kept[n] ?? '');
};

// code in its language (a name or a file extension, as highlight.js knows them), else as plain text
const highlight = (code, lang = '') => hljs.getLanguage(lang) ? hljs.highlight(code, { language: lang, ignoreIllegals: true }).value : escape(code);
marked.use({ renderer: { code: ({ text, lang }) => keep(`<pre><code>${highlight(text, (lang ?? '').split(/\s/)[0])}</code></pre>`) } });

// math in an assistant's text: $…$ or \(…\) inline, $$…$$ or \[…\] displayed (on lines of their own,
// or within a paragraph). A $ counts only against text, and a closing one only when no digit follows
// and no backtick comes between, so prices and code stay text. KaTeX sets it in its own fonts, the same
// on every device, and can't make it run or load anything (its \href and \includegraphics are off);
// markdown() puts it in after cleaning.
const MATH = /^(?:\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\$(?=\S)((?:\\.|[^$\\\n`])+?)(?<=\S)\$(?!\d)|\\\(([\s\S]+?)\\\))/;
function tex(src) {
  const m = MATH.exec(src);
  return m ? { type: 'math', raw: m[0], tex: m[1] ?? m[2] ?? m[3] ?? m[4], display: (m[1] ?? m[2]) !== undefined } : undefined;
}
const math = (t) => keep(katex.renderToString(t.tex, { displayMode: t.display, throwOnError: false, strict: false, errorColor: 'var(--warn)' }));
marked.use({ extensions: [
  // displayed math on lines of its own, a paragraph ending before it, so no line of it starts a list
  { name: 'math', level: 'block', renderer: math,
    start: (src) => { const i = src.search(/\n(?:\$\$|\\\[)/); return i < 0 ? undefined : i + 1; },
    tokenizer: (src) => { const t = tex(src); return t?.display && /^[^\S\n]*(\n|$)/.test(src.slice(t.raw.length)) ? t : undefined; } },
  { name: 'math', level: 'inline', renderer: math, start: (src) => src.search(/\$|\\[[(]/), tokenizer: tex },
] });
DOMPurify.addHook('afterSanitizeAttributes', (node) => node.tagName === 'A' && node.setAttribute('target', '_blank'));

function escape(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

// the line under the chat: what the turn the page follows waits for (its phase), else what failed or
// keeps the session from running. A call running says its tool (message, the partner it talks with),
// and a request tried again says why.
const PHASES = {
  waiting: () => 'Waiting for the model…', streaming: () => '', asking: () => 'Waiting for you to allow or deny the call…', denied: () => 'Denied.',
  running: ({ running }) => running?.tool === 'message' ? `Messaging ${state?.settings?.companion ?? state?.settings?.accompanies ?? 'its partner'}…` : `Running ${running?.tool ?? 'the call'}…`,
  retrying: ({ retry: { n, of, why } }) => `${why.length > 160 ? why.slice(0, 160) + '…' : why}: trying again (${n} of ${of})…`,
  forming: () => 'Forming memories…', stopping: () => 'Stopping…', ended: () => '',
};
function status() {
  if (page.error || page.broken) return [page.error || page.broken, true];
  if (page.live) return [PHASES[page.live.phase](page.live), false];
  if (state?.problem) return [state.problem, true];
  return state?.refused ? ['The summarizer refused; memory formation is stopped until surgery.', true] : ['', false];
}

const App = () => {
  const [line, warn] = status();
  return html`
    <aside>
      <div class="top">
        <button id="new-session" class="new" onClick=${creating}>New session</button>
        <button id="open-settings" class="icon" title="Settings: providers and their models" aria-label="Settings" onClick=${opening}>${ICONS.gear()}</button>
      </div>
      ${page.providers.length > 0 && !page.providers.some((p) => p.key) && html`<small class="nokey">Add a provider's API key in Settings to chat.</small>`}
      <h2>Sessions</h2>
      <${Sessions} />
    </aside>
    <section id="chat">
      <${Log} />
      <div id="status" class=${warn ? 'warn' : ''}>${line}</div>
      <${SayForm} />
    </section>
    <aside id="memory">
      <h2>Session</h2>
      <${Companion} />
      <${SessionForm} key=${current() + '/' + page.tuned} />
      <h2>Context</h2>
      <${Stats} />
      <h2>Memory pyramid</h2>
      <div class="legend">Each row up merges runs of the row below, each about a chunk's worth of tokens; bottom row is chunks of raw messages. Outlined: what the context shows. Click for its text.</div>
      <${Pyramid} />
      <pre id="detail">${page.detail}</pre>
    </aside>
    ${page.creating && html`<${NewSession} />`}
    ${page.settings && html`<${Settings} />`}
    ${page.accompanying && html`<${Accompany} />`}`;
};

// the sessions, grouped by workspace (those without one last), a companion in its session's
function Sessions() {
  const workspace = (s) => (s.accompanies ? page.sessions.find((p) => p.name === s.accompanies) ?? s : s).workspace || '';
  const groups = [...new Set(page.sessions.map(workspace))].sort((a, b) => !a - !b || a.localeCompare(b));
  return html`<div id="sessions">${groups.length ? groups.map((w) => html`<${Group} key=${w} workspace=${w} members=${page.sessions.filter((s) => workspace(s) === w)} />`) : html`<small>No sessions yet.</small>`}</div>`;
}

// a workspace's sessions, a fork under its parent and a companion under its session; its header folds
// it, as this browser remembers
function Group({ workspace: w, members }) {
  const above = (s) => s.parent?.name ?? s.accompanies, inside = (s) => members.some((m) => m.name === above(s));
  const link = (s, depth) => html`<a key=${s.name} href="#${s.name}" class=${s.name === current() ? 'on' : ''} style="padding-left:${6 + depth * 14}px">${s.name} <small>${s.messages}${s.parent ? ' · from ' + s.parent.at : ''}${s.accompanies ? ' · companion' : ''}</small></a>`;
  const draw = (parent, depth) => members.filter((s) => (inside(s) ? above(s) : null) === parent).flatMap((s) => [link(s, depth), ...draw(s.name, depth + 1)]);
  const title = w ? html`<b>${w.split(/[\\/]/).pop()}</b> · ${members.length}<small>${w}</small>` : html`<b>No workspace</b> · ${members.length}`;
  return html`<details class="group" data-workspace=${w} open=${!page.folded.has(w)} onToggle=${(e) => fold(w, !e.currentTarget.open)}><summary>${title}</summary>${draw(null, 0)}</details>`;
}

// a new session, in a dialog in the middle of the page: its name, and its workspace, one the sessions
// have (the session open's to start with), none, or another directory, typed (page.creating)
const OTHER = '…';
function NewSession() {
  const made = page.creating, workspaces = [...new Set(page.sessions.map((s) => s.workspace).filter(Boolean))].sort();
  const create = async (e) => {
    e.preventDefault();
    const { name, workspace, path } = e.target.elements;
    try {
      await api('/api/sessions', { name: name.value.trim(), workspace: (workspace.value === OTHER ? path.value.trim() : workspace.value) || null });
      page.creating = null;
      location.hash = name.value.trim();
    } catch (err) {
      made.error = err.message;
      draw();
    }
  };
  const choose = (e) => {
    made.workspace = e.target.value;
    draw();
  };
  return html`<dialog id="new" ref=${(d) => d && !d.open && d.showModal()} onClose=${() => { page.creating = null; draw(); }}>
    <form class="settings" onSubmit=${create}>
      <h2>New session</h2>
      <label>Name <input id="newname" name="name" required pattern="[A-Za-z0-9_\-]+" title="Letters, digits, - and _" placeholder="letters, digits, - and _" /></label>
      <label>Workspace, where its tools run <select id="newspace" name="workspace" onChange=${choose}>
        ${workspaces.map((w) => html`<option value=${w} selected=${w === made.workspace}>${w}</option>`)}
        <option value="" selected=${made.workspace === ''}>No workspace</option>
        <option value=${OTHER} selected=${made.workspace === OTHER}>Another directory…</option>
      </select></label>
      ${made.workspace === OTHER && html`<input id="newpath" name="path" required placeholder="/its/path, or ~/its/path" />`}
      <small class="warn">${made.error}</small>
      <div class="buttons">
        <button type="button" onClick=${(e) => e.target.closest('dialog').close()}>Cancel</button>
        <button class="primary">Create</button>
      </div>
    </form>
  </dialog>`;
}

// the Auto switch, and the session's companion or the session it accompanies (companion.rs): on, each
// one's turn's end goes to the other. Without a companion, turning it on opens the dialog that makes one.
function Companion() {
  const s = state?.settings ?? {}, partner = s.companion ?? s.accompanies;
  const flip = (e) => {
    if (partner) return auto(e.target.checked);
    e.target.checked = false;
    page.accompanying = { error: '' };
    draw();
  };
  return html`<div id="companion" class="pairing">
    <label class="switch" title=${partner ? 'While on, each one\'s turn\'s end goes to the other' : 'Make a companion: another session that keeps a goal and talks with this one'}>
      <input type="checkbox" id="auto" checked=${!!s.auto} disabled=${!state?.settings} onChange=${flip} />Auto</label>
    <small>${partner ? html`${s.companion ? 'with ' : 'companion of '}<a href="#${partner}">${partner}</a>` : 'no companion yet'}</small>
  </div>`;
}

// the dialog that makes the session's companion: the user's goal, and its name
function Accompany() {
  const made = page.accompanying, s = state?.settings ?? {};
  const make = async (e) => {
    e.preventDefault();
    const { name, goal } = e.target.elements;
    try {
      state = await api(`/api/s/${current()}/companion`, { name: name.value.trim(), goal: goal.value });
      page.accompanying = null;
      listSessions();
    } catch (err) { made.error = err.message; }
    draw();
  };
  return html`<dialog id="accompany" ref=${(d) => d && !d.open && d.showModal()} onClose=${() => { page.accompanying = null; draw(); }}>
    <form class="settings" onSubmit=${make}>
      <h2>A companion for ${current()}</h2>
      <small>Another session, on ${s.provider} · ${s.model}, that keeps the goal in mind and talks with ${current()} as a collaborator. While Auto is on, each one's turn's end goes to the other, and either can message the other at any time. It has no workspace; its settings are a session's like any other's.</small>
      <label>Goal <textarea id="goal" name="goal" rows="5" required placeholder="What the work is for, and what done looks like"></textarea></label>
      <label>Its name <input id="companionname" name="name" required pattern="[A-Za-z0-9_\-]+" title="Letters, digits, - and _" defaultValue=${current() + '-companion'} /></label>
      <small class="warn">${made.error}</small>
      <div class="buttons">
        <button type="button" onClick=${(e) => e.target.closest('dialog').close()}>Cancel</button>
        <button class="primary">Start, with Auto on</button>
      </div>
    </form>
  </dialog>`;
}

// the new-session dialog opened, its workspace the session open's
function creating() {
  page.creating = { workspace: state?.settings?.workspace ?? '', error: '' };
  draw();
}

// the settings, in a dialog in the middle of the page (page.settings): a card per provider sessions
// choose from, then one that adds a provider
function Settings() {
  const keyless = !page.providers.some((p) => p.key);
  return html`<dialog id="settings" ref=${(d) => d && !d.open && d.showModal()} onClose=${() => { page.settings = null; draw(); }}>
    <h2>Providers</h2>
    <small>${keyless ? 'Add a provider\'s API key to chat. DeepSeek: https://api.deepseek.com/anthropic, OpenRouter: https://openrouter.ai/api/v1' : 'A session runs on a provider\'s API, on one of the models it lists.'}</small>
    ${page.providers.map((p) => html`<${Provider} key=${p.name} p=${p} />`)}
    <${Provider} key=${'new-' + page.settings.made} />
    <div class="buttons"><button type="button" onClick=${(e) => e.target.closest('dialog').close()}>Done</button></div>
  </dialog>`;
}

// a provider's card: its base URL and its key (which the page never sees), saved by its button, and its
// models, saved as each is added (Enter, or +) or taken off (×); and a button that deletes it, once the
// user confirms; without `p`, a new provider's, named
function Provider({ p }) {
  const card = p?.name ?? '';
  const save = async (e) => {
    e.preventDefault();
    const { name, base, key } = e.target.elements;
    if (await provide(card, { name: p?.name ?? name.value, base: base.value, key: key.value })) e.target.reset();   // the key blank again
  };
  const add = async (e) => {
    const input = e.target.closest('.models').querySelector('input'), model = input.value.trim();
    if (model && await provide(card, { name: card, models: [...p.models, model] })) input.value = '';
  };
  const enter = (e) => { if (e.key === 'Enter') { e.preventDefault(); add(e); } };
  const forget = () => confirm(`Delete the provider ${card}? Sessions on it will need another.`) && provide(card, { name: card, delete: true });
  return html`<form class=${p ? 'card settings' : 'card settings adding'} data-provider=${card} onSubmit=${save}>
    <h3>${p ? p.name : 'New provider'}${p && !p.key && html`<small>no key</small>`}</h3>
    ${!p && html`<label>Name <input name="name" placeholder="openrouter" /></label>`}
    <label>Base URL <input name="base" defaultValue=${p?.base ?? ''} placeholder="https://openrouter.ai/api/v1" /></label>
    <label>API key <input name="key" type="password" autocomplete="off" placeholder=${p?.key ? 'unchanged if empty' : ''} /></label>
    ${p && html`<label>Models</label><div class="models">
      ${p.models.map((m) => html`<span class="model" key=${m}>${m}<button type="button" title=${'Take ' + m + ' off the list'} aria-label=${'Take ' + m + ' off'}
        onClick=${() => provide(card, { name: card, models: p.models.filter((x) => x !== m) })}>×</button></span>`)}
      <input name="model" placeholder="Add a model, as the provider names it" onKeyDown=${enter} />
      <button type="button" class="add" title="Add the model" aria-label="Add the model" onClick=${add}>+</button>
    </div>`}
    <div class="buttons">
      ${p && html`<button type="button" class="icon delete" title=${'Delete ' + card} aria-label=${'Delete ' + card} onClick=${forget}>${ICONS.trash()}</button>`}
      <small>${page.settings.notes[card]}</small>
      <button class="primary">${p ? 'Save' : 'Add provider'}</button>
    </div>
  </form>`;
}

// the session's main settings, as its file has them. A form's fields start from what the page shows and
// are the user's from then on (default values: Preact sets `value` again at every draw), until the form
// starts again (its key): another session, or a save. Its models are those of the provider chosen
// (page.picked), the session's own first if its provider doesn't list it; a provider without any takes
// a model typed.
function SessionForm() {
  const s = state?.settings ?? {}, provider = page.picked ?? s.provider;
  const listed = page.providers.find((p) => p.name === provider)?.models ?? [];
  const models = provider === s.provider && s.model && !listed.includes(s.model) ? [s.model, ...listed] : listed;
  const pick = (e) => {
    page.picked = e.target.value;
    draw();
  };
  return html`<form id="session" class="settings" onSubmit=${tune}>
    <label>Provider <select name="provider" id="sprovider" onChange=${pick}>${page.providers.map((p) => html`<option selected=${p.name === s.provider}>${p.name}</option>`)}</select></label>
    <label>Model ${models.length ? html`<select name="model" key=${provider}>${models.map((m) => html`<option selected=${m === s.model}>${m}</option>`)}</select>`
      : html`<input name="model" defaultValue=${s.model ?? ''} placeholder="its name, as the provider has it" />`}</label>
    <label>Workspace <input name="workspace" defaultValue=${s.workspace ?? ''} placeholder="none: no bash" /></label>
    <label><input name="sandbox" type="checkbox" defaultChecked=${!!s.sandbox} /> bash in the sandbox</label>
    <label>Window <input name="window" type="number" defaultValue=${s.window ?? ''} /></label>
    <label>Reply reserve <input name="reserve" type="number" defaultValue=${s.reserve ?? ''} /></label>
    <label>System prompt <textarea name="system" rows="2" defaultValue=${s.system ?? ''}></textarea></label>
    <button>Save</button>
    <small id="ssaved">${page.notes.session || 'The rest is in the session\'s session_settings.json.'}</small>
  </form>`;
}

function SayForm() {
  const say = (e) => {
    e.preventDefault();
    const box = e.target.elements.text, text = box.value.trim();
    if (text) {
      box.value = '';
      fit(box);
      turn(text);
    }
  };
  const enter = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); e.target.form.requestSubmit(); } };
  return html`<form id="say" onSubmit=${say}>
    <textarea id="text" name="text" placeholder="Message (Enter sends, Shift+Enter for a new line)" onKeyDown=${enter} onInput=${(e) => fit(e.target)}></textarea>
    <button class="icon send" title="Send (Enter)" aria-label="Send">${ICONS.send()}</button>
    <button type="button" id="continue" class="icon" title="Let the model go on, without a message" aria-label="Continue" onClick=${() => turn(null)}>${ICONS.go()}</button>
    <button type="button" id="stop" class="icon stop" title="Stop the turn" aria-label="Stop" disabled=${!page.live} onClick=${stop}>${ICONS.stop()}</button>
  </form>`;
}

// the message box as tall as what's in it (to half the window, then it scrolls), its buttons with it;
// the log, if it was at its end, stays there as the box takes its room
function fit(box) {
  const log = document.getElementById('log'), end = log.scrollHeight - log.scrollTop - log.clientHeight < 48;
  box.style.height = 'auto';
  box.style.height = `${box.scrollHeight + box.offsetHeight - box.clientHeight}px`;   // its borders too
  if (end) log.scrollTop = log.scrollHeight;
}

// the buttons' pictures (each drawn anew where it's used), in the text's color: a paper plane

    <path d="M10.14 5.05 10.44 2.12h3.12l.3 2.93A7.2 7.2 0 0 1 15.6 5.76l2.28-1.85 2.21 2.21-1.85 2.28a7.2 7.2 0 0 1 .71 1.74l2.93.3v3.12l-2.93.3a7.2 7.2 0 0 1-.71 1.74l1.85 2.28-2.21 2.21-2.28-1.85a7.2 7.2 0 0 1-1.74.71l-.3 2.93h-3.12l-.3-2.93a7.2 7.2 0 0 1-1.74-.71l-2.28 1.85-2.21-2.21 1.85-2.28a7.2 7.2 0 0 1-.71-1.74l-2.93-.3v-3.12l2.93-.3a7.2 7.2 0 0 1 .71-1.74L3.91 6.12l2.21-2.21L8.4 5.76a7.2 7.2 0 0 1 1.74-.71z" fill="currentColor" fill-opacity=".14" />

    <path d="M5.8 8.8l.9 10.9c.1 1 .9 1.8 1.9 1.8h6.8c1 0 1.8-.8 1.9-1.8l.9-10.9z" fill="currentColor" fill-opacity=".14" />

// the log's messages, then the reply streaming in. A message's line (whose it is) shows only where the
// speaker changes, and a message of tool results whose results all joined their calls isn't shown.
// Two views from its top, the log's earlier messages load (earlier), until the page has the first, so
// they're there before the user scrolls to them.
function Log() {
  const { messages, live } = page, reply = live?.reply;
  const results = new Map([...messages.flatMap((m) => m.content), ...(live?.results ?? [])].filter((b) => b.type === 'tool_result').map((b) => [b.toolUseId, b]));
  const calls = new Set(messages.flatMap((m) => m.content.filter((b) => b.type === 'tool_use').map((b) => b.id)));
  let who = null;
  const rows = messages.flatMap((m) => {
    const hidden = m.content.every((b) => b.type === 'tool_result' && calls.has(b.toolUseId)), more = m.participant === who;
    if (!hidden) who = m.participant;
    const own = m.content.filter((b) => b.type === 'tool_use').map((b) => b.id);
    return [m.fold && html`<${FoldLine} key=${'fold-' + m.id} fold=${m.fold} />`,
      html`<${Message} key=${m.id} m=${m} more=${more} hidden=${hidden} results=${own.map((id) => results.get(id))} asked=${own.map((id) => !!live?.asked.has(id))} running=${own.map((id) => live?.running?.id === id)}
        joined=${m.content.map((b) => b.type === 'tool_result' && calls.has(b.toolUseId))} />`];
  });
  const top = messages.length > 0 && html`<div class="earlier">${messages[0].id === 0 ? 'The start of the session.' : page.earlier === 'loading' ? 'Loading earlier messages…' : ''}</div>`;
  return html`<div id="log" onScroll=${(e) => e.currentTarget.scrollTop < 2 * e.currentTarget.clientHeight && earlier()}>${top}${rows}${reply && reply.key > (messages.at(-1)?.id ?? -1) && [
    reply.fold && html`<${FoldLine} key="fold-live" fold=${reply.fold} live />`,
    html`<${Reply} key=${'reply-' + reply.key} reply=${reply} more=${who === 'assistant'} strays=${live.results.filter((b) => !calls.has(b.toolUseId))} />`,
  ]}</div>`;
}

// how the context folded before a reply: the nodes it shows instead of which, by layer, and the tokens
// that saves (or costs, when it unfolds)
function FoldLine({ fold: { from, into, saved }, live }) {
  const noun = (layer, n) => layer == 0 ? (n > 1 ? 'chunks' : 'chunk') : `L${layer} ${n > 1 ? 'memories' : 'memory'}`;
  const nodes = (list) => Object.entries(Object.groupBy(list, ([layer]) => layer)).map(([layer, all]) => `${all.length} ${noun(layer, all.length)}`).join(', ');
  return html`<div class=${live ? 'fold live' : 'fold'}>Context ${saved >= 0 ? 'folded' : 'unfolded'}: ${nodes(from)} → ${nodes(into)} · ${tokens(Math.abs(saved))} tokens ${saved >= 0 ? 'saved' : 'more'}</div>`;
}

// whether two components' props are the same: each the same value, or arrays of the same values
const same = (a, b) => Object.keys({ ...a, ...b }).every((k) => a[k] === b[k] || (Array.isArray(a[k]) && Array.isArray(b[k]) && a[k].length === b[k].length && a[k].every((x, i) => x === b[k][i])));

// a message of the log, each block a bubble of its own (the user's on the right), drawn again only when
// what it shows changes: its calls' results, and which of them wait for an answer
class Message extends Component {
  shouldComponentUpdate(next) { return !same(this.props, next); }

  render({ m, more, hidden, results, asked, running, joined }) {
    const all = m.content.every((b) => b.type === 'tool_result'), calls = m.content.filter((b) => b.type === 'tool_use');
    const heard = m.participant !== 'user' && m.participant !== 'assistant';
    const block = (b, j) => {
      switch (b.type) {
        case 'text': return heard ? html`<${Heard} text=${b.text} from=${m.participant} />`
          : m.participant === 'assistant' ? html`<div class="bubble md" data-kind="text" dangerouslySetInnerHTML=${{ __html: markdown(b.text) }} />` : html`<div class="bubble" data-kind="text">${b.text}</div>`;
        case 'thinking': return html`<${Thinking} text=${b.thinking} />`;
        case 'tool_use': return html`<${Card} call=${b} result=${results[calls.indexOf(b)]} asking=${asked[calls.indexOf(b)]} running=${running[calls.indexOf(b)]} />`;
        case 'tool_result': return joined[j] ? null : html`<${Card} result=${b} />`;   // its call isn't on the page
        default: return html`<div class="bubble" data-kind=${b.type}>${note(b)}</div>`;
      }
    };
    return html`<div class=${'msg' + (all ? ' results' : '') + (more ? ' more' : '') + (heard ? ' heard' : '')} data-id=${m.id} data-who=${m.participant} hidden=${hidden}>
      <div class="who">${m.participant}${all ? ' · tool results' : ''}</div>
      <button class="icon" data-fork=${m.id} title="Fork the session here" aria-label="Fork here" onClick=${() => fork(m.id)}>${ICONS.fork()}</button>
      ${m.content.map(block)}
    </div>`;
  }
}

// a message from the session's partner (companion.rs): how it came, then what it says, as markdown, and
// what it ran
function Heard({ text, from }) {
  const parts = text.split('\n\n'), ran = parts.length > 2 && parts.at(-1).startsWith(`What ${from} ran this turn: `);
  return html`<div class="bubble" data-kind="text"><div class="head">${parts[0]}</div>
    <div class="md" dangerouslySetInnerHTML=${{ __html: markdown(parts.slice(1, ran ? -1 : undefined).join('\n\n')) }} />
    ${ran && html`<div class="ran">${parts.at(-1)}</div>`}</div>`;
}

// the reply streaming in: its parts, each a run of reasoning or of text, or a call as the reply writes
// it; and results whose calls aren't on the page. Without any it's hidden, by a class: Firefox doesn't
// draw again a rule like :has(> .who:only-child) as children come, and left the reply hidden.
const Reply = ({ reply, more, strays }) => html`<div class=${'msg' + (more ? ' more' : '') + (reply.parts.length || strays.length ? '' : ' empty')} id="reply" data-who="assistant">
  <div class="who">assistant</div>
  ${reply.parts.map((part, i) => part.kind === 'thinking' ? html`<${Thinking} key=${i} text=${part.source} live=${i === reply.parts.length - 1} />`
    : part.kind === 'text' ? html`<div key=${i} class="bubble md" data-kind="text">${part.done.map((done, k) => html`<div class="done" key=${k} dangerouslySetInnerHTML=${{ __html: done }} />`)}<div class="tail" dangerouslySetInnerHTML=${{ __html: markdown(part.source.slice(part.cut)) }} /></div>`
    : html`<details key=${i} class="tool" open data-kind="calling"><summary>${part.name} …</summary><pre>${part.source}</pre></details>`)}
  ${strays.map((b) => html`<${Card} key=${b.toolUseId} result=${b} />`)}
</div>`;

// reasoning, folded to its last line (the end of it, when long); while it streams in (`live`), open
// to its newest lines, so each piece shows as it comes
function Thinking({ text, live }) {
  if (live) return html`<div class="thinking live" data-kind="thinking"><span>Thinking…</span><div><div>${text}</div></div></div>`;
  const line = text.trimEnd().split('\n').pop();
  return html`<details class="thinking" data-kind="thinking"><summary>Thinking<span class="last">${line.length > 200 ? '…' + line.slice(-200) : line}</span></summary><div>${text}</div></details>`;
}

const note = (b) => b.type === 'image' ? `[image, ${b.kb} KB]` : `[${b.type}]`;
const said = (result) => typeof result.content === 'string' ? result.content : result.content.map((c) => c.text ?? note(c)).join('\n');

// a call's card as its tool shows it: the line it shows folded (open, all of it), and what it holds
// above the result; any other tool's, its name and its input
const views = {
  bash: ({ command = '' }) => [html`<span class="cmd">${command}</span>`],
  web_search: ({ query = '' }) => [html`<span class="query">${ICONS.search()}${query}</span>`],
  edit: (input, result) => [`edit ${input.path ?? ''}`, html`<${Change} edit=${input} result=${result} />`],
};

// a call's card, open until its result joins it, then folded unless it shows a diff, with the buttons
// that answer whether it may run while it's `asking`, and saying so while it's `running`; a result
// without its call on the page is a card of its own
function Card({ call, result, asking, running }) {
  const view = call && (views[call.name] ?? ((input) => [call.name, html`<pre>${JSON.stringify(input)}</pre>`]));
  const [head, body] = call ? view(call.input, result) : ['an earlier call'];
  const text = result && said(result), failed = result?.isError ? ' failed' : '';
  const answer = (answer, label) => html`<button data-answer=${answer} onClick=${() => approve(call.id, answer)}>${label}</button>`;
  return html`<details class=${'tool' + failed} id=${call && 'call-' + call.id} data-kind=${call ? 'tool_use' : 'tool_result'} open=${!result || view === views.edit}>
    <summary>${head}${result && html`<span class="out"> → ${text.split('\n')[0].slice(0, 100)}</span>`}</summary>
    ${body}
    ${asking && !result && html`<div class="ask">${answer('allow', 'Allow')}${answer('always', 'Always allow')}${answer('deny', 'Deny')}</div>`}
    ${running && !result && html`<div class="running">running…</div>`}
    ${result && html`<pre class=${'result' + failed}>${text}</pre>`}
  </details>`;
}

// an edit's change as a diff: the lines it takes out and puts in (all in, for a new file), colored in
// its file's language, each marked in a gutter the page draws and a copy leaves out (data-mark, then
// data-n: its number, from where its result says the edit starts: "at line N", or 1 for a file it made;
// a line taken out by the file's old count, any other by its new)
function Change({ edit: { path = '', old = '', new: text = '' }, result }) {
  const done = result && !result.isError ? said(result) : '';
  const start = Number(/at line (\d+)$/.exec(done)?.[1] ?? (done.startsWith('made ') ? 1 : 0));
  let [before, after] = [start, start];
  const lines = Diff.diffLines(String(old), String(text)).flatMap((part) => {
    const [mark, kind] = part.added ? ['+', 'add'] : part.removed ? ['-', 'del'] : [' ', ''];
    return part.value.replace(/\n$/, '').split('\n').map((line) => {
      const n = mark === '-' ? before : after;
      if (mark !== '+') before++;
      if (mark !== '-') after++;
      return html`<div class=${kind} data-mark=${mark} data-n=${start ? n : undefined} dangerouslySetInnerHTML=${{ __html: highlight(line, String(path).split('.').pop()) }} />`;
    });
  });
  return html`<pre class="diff">${lines}</pre>`;
}

const tokens = (n) => new Intl.NumberFormat('en', { notation: 'compact', maximumFractionDigits: 1 }).format(n);
// what requests cost, in dollars, if their provider said
const dollars = (used) => !used ? 'none yet' : used.cost == null ? 'not reported' : '$' + used.cost.toFixed(used.cost < 1 ? 4 : 2);

// the session's numbers, and its tools, a click on one toggling whether the session always allows it
function Stats() {
  if (!state) return html`<div id="stats"></div>`;
  const s = state, used = s.prompt ?? s.armed ?? 0, total = s.spent?.total, { window = 0, model = '', allow = [] } = s.settings || {};
  const stat = (label, value, title) => html`<div class="stat"><span>${label}</span><span title=${title}>${value}</span></div>`;
  const chip = (tool) => {
    const on = allow.includes(tool);
    return html`<button class=${'chip' + (on ? ' on' : '')} data-tool=${tool} title=${on ? 'Always allowed. Click to ask first.' : 'Asks first. Click to always allow.'} onClick=${() => allows(tool)}>${tool}</button>`;
  };
  return html`<div id="stats">
    ${stat('Last context', `${Math.round(used).toLocaleString()} / ${window.toLocaleString()} tokens${s.prompt == null ? ' (estimated)' : ''}`, s.prompt == null ? 'The last compile\'s estimate' : 'The last request\'s prompt, as the provider counted it')}
    <div class="bar"><div style="width:${Math.min(100, 100 * used / window)}%"></div></div>
    ${stat('Messages', s.messages)}
    ${stat('Chunks · memories', `${s.layers[0] || 0} · ${s.layers.slice(1).join(' / ') || 0}`)}
    ${stat('Cost of replies', dollars(s.spent?.reply))}
    ${stat('Cost of memories', dollars(s.spent?.memories), 'The summarizer\'s requests, which form the memories')}
    ${stat('Total cost', dollars(total), 'What the session\'s requests cost, as the provider reports it')}
    ${stat('Tokens', total ? `in ${tokens(total.input)} (${tokens(total.cached)} cached) · out ${tokens(total.output)}` : 'none yet', 'In all the session\'s prompts (of them, read from the provider\'s cache) and its replies')}
    ${stat('Price multiplier', (s.multiplier || 1).toFixed(3))}
    ${stat('Model', model)}
    ${stat('Tools', s.tools.length ? s.tools.map(chip) : 'none')}
    ${stat('Tools and system prompt', `${Math.round(s.overhead).toLocaleString()} tokens`)}
  </div>`;
}

// a row per layer, the top one first; a cell spans the chunks it covers, outlined if the context shows
// it, and a click on it shows its record
function Pyramid() {
  const s = state, layers = s?.layers ?? [];
  const width = (n) => 100 * n / Math.max(layers[0] || 0, 1), shown = new Set((s?.frontier || []).map(([l, p]) => `${l}/${p}`));
  const rows = layers.map((count, level) => {
    const color = level === 0 ? '' : `background: var(--l${Math.min(level, 5)});`;
    const covers = (p) => level < 2 ? [p, p + 1] : s.covers[level - 2][p];   // the chunks it covers: a chunk and an L1 their own
    const cells = Array.from({ length: count }, (_, p) => covers(p)).map(([from, to], p) => html`<div class=${'cell' + (shown.has(`${level}/${p}`) ? ' shown' : '')} title="${level ? 'L' + level : 'chunk'} ${p}"
      style="left:${width(from)}%;width:calc(${width(to - from)}% - 2px);${color}" onClick=${() => detail(level, p)} />`);
    return html`<div class=${level === 0 ? 'row chunks' : 'row'}>${cells}</div>`;
  });
  return html`<div id="pyramid" class="pyramid">${rows.length ? rows.reverse() : html`<small class="legend">No chunks yet: everything is still in the raw tail.</small>`}</div>`;
}

// what the page does: each changes what it shows, then draws it again

function fail(err) {
  page.error = err.message;
  redraw();
}

async function listSessions() {
  page.sessions = await api('/api/sessions');
  redraw();
}

async function loadProviders() {
  ({ providers: page.providers } = await api('/api/settings'));
  redraw();
}

// a group of sessions folded or opened, kept in this browser
function fold(workspace, folded) {
  if (folded === page.folded.has(workspace)) return;
  if (folded) page.folded.add(workspace); else page.folded.delete(workspace);
  try { localStorage.setItem('folded', JSON.stringify([...page.folded])); } catch { /* no storage here: kept until the page reloads */ }
  redraw();
}

// the settings dialog opened, the providers as settings.json has them now
function opening() {
  page.settings = { notes: {}, made: 0 };
  draw();
  loadProviders();
}

// a provider saved as `body` gives it (Settings::provide in settings.rs), from `card` (its name, '' for
// a new one's); whether it was, under the card it's on now (a new one's starts again)
async function provide(card, body) {
  const open = page.settings;
  try {
    ({ providers: page.providers } = await api('/api/settings', body));
    open.notes[card] = '';
    open.notes[body.name.trim()] = 'Saved.';
    if (!card) open.made++;
    return true;
  } catch (err) {
    open.notes[card] = err.message;
    return false;
  } finally { draw(); }
}

async function tune(e) {
  e.preventDefault();
  const value = (el) => el.type === 'checkbox' ? el.checked : el.type === 'number' ? Number(el.value) : el.value || null;
  try {
    state = await api(`/api/s/${current()}/settings`, Object.fromEntries([...e.target.elements].filter((el) => el.name).map((el) => [el.name, value(el)])));
    [page.notes.session, page.tuned, page.picked] = ['Saved.', page.tuned + 1, null];
  } catch (err) { page.notes.session = err.message; }
  redraw();
}

// Auto turned on or off, for the session and its partner
async function auto(on) {
  try { state = await api(`/api/s/${current()}/auto`, { on }); } catch (err) { fail(err); }
  draw();
}

// a tool the session always allows, or no longer
async function allows(tool) {
  const { allow } = state.settings;
  try {
    state = await api(`/api/s/${current()}/settings`, { allow: allow.includes(tool) ? allow.filter((t) => t !== tool) : [...allow, tool] });
    redraw();
  } catch (err) { fail(err); }
}

async function detail(level, p) {
  const [record] = await api(`/api/s/${current()}/layer/${level}?from=${p}&to=${p + 1}`);
  page.detail = level === 0
    ? `Chunk ${p}: messages ${record.first}–${record.last}, ~${Math.round(record.raw)} tokens raw`
    : `L${level} memory ${p} (messages ${record.first}–${record.last}, ${record.tokens} tokens)\n\n${record.text}`;
  redraw();
}

async function fork(at) {
  const name = prompt(`Name for a fork of ${current()} at message #${at}`, `${current()}-${at}`);
  if (!name) return;
  try {
    await api(`/api/s/${current()}/fork`, { at, name });
    location.hash = name;
  } catch (err) { fail(err); }
}

// a page's answer whether a call may run: its buttons go, and the turn shows the answer until it goes on
async function approve(id, answer) {
  page.live?.asked.delete(id);
  if (page.live) page.live.phase = answer === 'deny' ? 'denied' : 'running';
  draw();
  try { await api(`/api/s/${current()}/approve`, { id, answer }); } catch (err) { fail(err); }
}

// the turn running stopped where it is (work.rs's Worker::stopped)
async function stop() {
  if (page.live) page.live.phase = 'stopping';
  draw();
  try { await api(`/api/s/${current()}/stop`, {}); } catch (err) { fail(err); }
}

// a page of the log's earlier messages, before the first the page has, put above the log's view
async function earlier() {
  const [name, first] = [current(), page.messages[0]?.id];
  if (!first || page.earlier) return;   // none before message 0, or a page loads already
  page.earlier = 'loading';
  redraw();
  try {
    const got = await api(`/api/s/${name}/messages?to=${first}`);
    if (name === current() && page.messages[0]?.id === first) {
      const log = document.getElementById('log');
      [page.keep, page.messages] = [log.scrollTop < 1 ? log.scrollHeight : null, [...got, ...page.messages]];
    }
  } catch (err) { fail(err); }
  page.earlier = null;
  draw();
}

// a turn: `text` joins the log and the model answers it, or without text the model goes on from the
// log as it is; the page hears it as it follows the session
async function turn(text) {
  if (!current()) return;
  [page.error, page.scroll] = [null, true];
  try { await api(`/api/s/${current()}/${text ? 'say' : 'continue'}`, { text }); } catch (err) { fail(err); }
}

// the session the page shows, followed while the page is in view: out of view it lets go of it (a
// browser keeps few connections to a server open at once), and back in view follows it again
function subscribe() {
  stream?.abort();
  stream = null;
  if (current() && !document.hidden) follow(current(), (stream = new AbortController()).signal);
}

// a session as it goes on (Event in hub.rs): a JSON object a line, each field handled by its handler in
// `on` (an empty piece draws nothing). First the log's newest messages, then the session ({"state"}),
// at which the page shows them in place of what it had; then each message as it joins the log, and each
// turn from its start ({"turn"}) to its job's end ({"done"}). A turn (page.live) goes through phases,
// which the line under the chat shows: waiting for the model, streaming, asking whether a call may run
// (then running or denied, once answered), running a call, the request tried again, forming memories,
// ended. Its reply streams in below the log
// until the log has it. A stream that ends unasked (the server restarted) is followed again shortly.
async function follow(name, signal) {
  let caught = [];   // the log's newest messages, until the page has caught up
  // a run of reasoning or of text continues the reply's last part
  const part = (kind) => {
    if (page.live.reply.parts.at(-1)?.kind !== kind) page.live.reply.parts.push({ kind, source: '', cut: 0, done: [] });
    return page.live.reply.parts.at(-1);
  };
  const piece = (grown) => (piece) => {
    page.live.phase = 'streaming';
    grow(grown(), piece);
  };
  const on = {
    message: (m) => {
      if (caught) caught.push(m);
      else if (m.id > (page.messages.at(-1)?.id ?? -1)) page.messages = [...page.messages, m];
    },
    // the session, and the log's newest messages in place of those the page had, but for the earlier
    // ones it loaded that come just before them (a page that follows again keeps its place); opening the
    // session takes the log to its end
    state: (s) => {
      [state, page.broken] = [s, null];
      if (caught) {
        const next = caught[0]?.id ?? 0, kept = page.messages.filter((m) => m.id < next);
        [page.scroll, page.messages, caught] = [!page.messages.length, kept.at(-1)?.id === next - 1 ? [...kept, ...caught] : caught, null];
      }
      if (!s.running) page.live = null;
    },
    broken: (why) => { page.broken = why; },
    turn: (job) => { [page.live, page.error] = [{ job, phase: 'waiting', reply: null, asked: new Set(), results: [], running: null, retry: null, ended: false }, null]; },
    done: () => {
      page.live = null;
      listSessions();
    },
    spent: (spent) => { state.spent = spent; },
    prompt: (prompt) => { state.prompt = prompt; },
  };
  // what happens in a turn
  const turned = {
    // the log has grown: the reply to come starts below it
    logged: (n) => { Object.assign(page.live, { phase: 'waiting', reply: { key: n, fold: null, parts: [] }, results: [] }); },
    fold: (fold) => { page.live.reply.fold = fold; },
    thinking: piece(() => part('thinking')),
    text: piece(() => part('text')),
    calling: (name) => { page.live.reply.parts.push({ kind: 'calling', name, source: '' }); },
    input: piece(() => page.live.reply.parts.at(-1)),
    approve: (id) => {
      page.live.asked.add(id);
      page.live.phase = 'asking';
    },
    answered: (id) => {
      page.live.asked.delete(id);
      if (page.live.phase === 'asking') page.live.phase = 'streaming';
    },
    running: (call) => { Object.assign(page.live, { phase: 'running', running: call }); },
    // the reply's request failed and is tried again: what streamed of it is void
    retry: (retry) => {
      Object.assign(page.live, { phase: 'retrying', retry });
      if (page.live.reply) page.live.reply.parts = [];
    },
    result: (b) => {
      page.live.results.push(b);
      if (page.live.running?.id === b.toolUseId) page.live.running = null;
    },
    forming: (forming) => { page.live.phase = forming ? 'forming' : page.live.ended ? 'ended' : 'waiting'; },
    // the turn has ended (`why` it failed, if it did); its memories form after it
    end: (why) => {
      Object.assign(page.live, { phase: 'ended', reply: null, ended: true });
      page.error = why;
    },
  };
  const take = (event) => {
    for (const [field, value] of Object.entries(event)) if (value !== '') (on[field] ?? (page.live && turned[field]))?.(value);
    redraw();
  };
  try {
    const reader = (await fetch(`/api/s/${name}/stream`, { signal })).body.pipeThrough(new TextDecoderStream()).getReader();
    let buffered = '';
    for (let read; !(read = await reader.read()).done;) {
      const lines = (buffered + read.value).split('\n');
      buffered = lines.pop();
      lines.filter((line) => line.trim()).forEach((line) => take(JSON.parse(line)));
    }
  } catch (err) {
    if (err.name === 'AbortError') return;
  }
  setTimeout(() => stream?.signal === signal && subscribe(), 2000);
}

// a piece onto a part of the reply. A text's finished blocks (its markdown up to its last blank line
// outside code) are made once, so only the rest is made again as pieces come.
function grow(part, piece) {
  part.source += piece;
  if (part.kind !== 'text') return;
  let [code, cut] = [false, part.cut];
  for (const m of part.source.slice(part.cut).matchAll(/^(?:```|~~~)|\n\n/gm)) {
    if (m[0] !== '\n\n') code = !code;
    else if (!code) cut = part.cut + m.index + 2;
  }
  if (cut > part.cut) part.done.push(markdown(part.source.slice(part.cut, cut)));
  part.cut = cut;
}

try { page.folded = new Set(JSON.parse(localStorage.getItem('folded')) || []); } catch { /* no storage here: groups start open */ }
window.onhashchange = () => {
  [page.notes.session, page.picked, page.live, page.error, page.accompanying, page.messages] = ['', null, null, null, null, []];
  listSessions();
  subscribe();
};
document.onvisibilitychange = subscribe;
redraw();
loadProviders();
listSessions();
subscribe();
</script>
</body>
</html>
