<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connectome</title>
<script src="/libs.js"></script>
<link rel="stylesheet" href="/katex.css">
<style>
:root {
  --bg: #f7f6f3; --panel: #ffffff; --ink: #1d1c1a; --muted: #6b6862; --line: #e3e0da;
  --accent: #2f6fdf; --tail: #2f9e6a; --raw: #8a8780; --warn: #c2410c;
  --l1: #c9dcfb; --l2: #a5c4f6; --l3: #7ea8ee; --l4: #5a8de4; --l5: #3d72d6;
  --add: #e6f4ea; --del: #fbe9e7; --kw: #8250df; --str: #0a7a3e; --num: #b35900; --type: #b3006b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161615; --panel: #1f1f1d; --ink: #ecebe7; --muted: #9a978f; --line: #33322f;
    --accent: #6b9cf5; --tail: #4cc38a; --raw: #8f8c85; --warn: #f97316;
    --l1: #23375c; --l2: #2b4778; --l3: #345a97; --l4: #3f6db5; --l5: #4b82d4;
    --add: #1c3326; --del: #3d2224; --kw: #c4a5ff; --str: #7ee2a8; --num: #ffb36b; --type: #ff8fc8;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, sans-serif; }
main { display: grid; grid-template-columns: 220px 1fr 360px; height: 100vh; }
aside, section { overflow: auto; padding: 16px; }
aside { border-right: 1px solid var(--line); }
#memory { border-left: 1px solid var(--line); border-right: 0; }
h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
button, input, textarea, select { font: inherit; color: inherit; }
button { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button:hover { border-color: var(--accent); }
input, textarea, select { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
input[type=checkbox] { width: auto; }
#sessions a { display: block; padding: 4px 6px; border-radius: 6px; color: inherit; text-decoration: none; }
#sessions a.on { background: var(--panel); outline: 1px solid var(--line); }
#sessions small { color: var(--muted); }
.group { margin: 0 0 6px; }
.group summary, .provider { cursor: pointer; padding: 4px 0; }
.group summary small, .provider small { display: block; font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }
.settings { display: flex; flex-direction: column; gap: 6px; padding: 0; border: 0; }
.settings label, .settings small, .legend, .msg .who { font-size: 12px; color: var(--muted); }
#chat { display: flex; flex-direction: column; padding: 0; }
#log { flex: 1; overflow: auto; padding: 16px; }
.msg { position: relative; margin-top: 12px; }
.msg .who { margin-bottom: 4px; }
.msg.more { margin-top: 0; }
.msg.more > .who { display: none; }
.msg[data-who="user"]:not(.results) { display: flex; flex-direction: column; align-items: flex-end; }
.msg[data-who="user"]:not(.results) .bubble { max-width: 85%; }
.msg[data-who="user"] > button { right: auto; left: 0; }
.bubble, .thinking, .tool { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin: 0 0 6px; }
.bubble { white-space: pre-wrap; word-wrap: break-word; }
.thinking { border-style: dashed; color: var(--muted); padding: 6px 10px; }
.thinking > div { white-space: pre-wrap; font-style: italic; margin-top: 6px; }
.thinking .last { display: inline-block; max-width: calc(100% - 90px); vertical-align: bottom; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-style: italic; margin-left: 6px; }
.thinking[open] .last { display: none; }
.md { white-space: normal; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md pre, .md code { font: 12px/1.4 ui-monospace, monospace; background: var(--bg); border-radius: 4px; }
.md pre { padding: 8px; overflow: auto; }
.md :not(pre) > code { padding: 1px 4px; }
.md table { border-collapse: collapse; }
.md th, .md td { border: 1px solid var(--line); padding: 2px 8px; }
.md a[href] { color: var(--accent); }
.md .katex-display { margin: 8px 0; }
.hljs-keyword, .hljs-built_in, .hljs-selector-tag { color: var(--kw); }
.hljs-string, .hljs-regexp, .hljs-char { color: var(--str); }
.hljs-number, .hljs-literal, .hljs-symbol { color: var(--num); }
.hljs-comment, .hljs-quote { color: var(--muted); font-style: italic; }
.hljs-title, .hljs-section { color: var(--accent); }
.hljs-type, .hljs-attr, .hljs-attribute, .hljs-meta, .hljs-variable { color: var(--type); }
.diff > div::before { content: attr(data-n) " " attr(data-mark); display: inline-block; width: 6ch; margin-right: 1ch; text-align: right; color: var(--muted); white-space: pre; }   /* never copied */
.diff .add { background: var(--add); }
.diff .del { background: var(--del); }
.md blockquote { margin: 0; padding-left: 10px; border-left: 3px solid var(--line); color: var(--muted); }
.thinking summary { cursor: pointer; font-size: 12px; }
.thinking summary, .tool summary { list-style: none; }
.thinking summary::-webkit-details-marker, .tool summary::-webkit-details-marker { display: none; }
.tool { padding: 6px 10px; }
.tool summary { cursor: pointer; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tool[open] summary { white-space: pre-wrap; }
.tool[open] summary .out { display: none; }
.cmd { font: 12px/1.4 ui-monospace, monospace; color: var(--ink); }
.cmd::before { content: '$ '; color: var(--muted); }
.tool pre { white-space: pre-wrap; font: 12px/1.4 ui-monospace, monospace; margin: 4px 0; }
.tool.failed summary, .tool pre.failed { color: var(--warn); }
.ask { display: flex; gap: 6px; margin: 4px 0 6px; }
#reply:has(> .who:only-child) { display: none; }
.chip { font-size: 12px; padding: 0 6px; margin-left: 4px; color: var(--muted); }
.chip.on { border-color: var(--tail); color: var(--tail); }
.msg > button { position: absolute; top: 0; right: 0; font-size: 12px; padding: 1px 6px; display: none; }
.msg:hover > button { display: block; }
form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
form textarea { resize: vertical; min-height: 42px; }
#status { color: var(--muted); font-size: 12px; padding: 0 16px 8px; min-height: 18px; }
#status.warn { color: var(--warn); }
.pyramid { display: flex; flex-direction: column; gap: 3px; margin: 8px 0 12px; }
.row { position: relative; height: 18px; }
.cell { position: absolute; top: 0; bottom: 0; border-radius: 3px; border: 1px solid transparent; cursor: pointer; min-width: 2px; }
.cell.shown { border-color: var(--ink); }
.row.chunks .cell { background: var(--raw); opacity: .5; }
.row.chunks .cell.shown { opacity: 1; }
.stat { display: flex; justify-content: space-between; font-size: 13px; padding: 2px 0; }
.bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 4px 0 12px; }
.bar div { height: 100%; background: var(--accent); }
pre#detail { white-space: pre-wrap; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px; font: 12px/1.4 ui-monospace, monospace; max-height: 40vh; overflow: auto; }
@media (max-width: 900px) {
  main { grid-template-columns: 1fr; height: auto; }
  #chat { height: 80vh; }
}
</style>
</head>
<body>
<main>
  <aside>
    <h2>Sessions</h2>
    <div id="sessions"></div>
    <form id="create" class="settings" style="padding: 12px 0;">
      <input id="newname" placeholder="new session name">
      <input id="newspace" placeholder="its workspace, where bash runs">
      <button>Create</button>
    </form>
    <h2>Providers</h2>
    <div id="providers"></div>
    <form id="provider" class="settings">
      <label>Name <input id="pname" placeholder="openrouter"></label>
      <label>Base URL <input id="base" placeholder="https://openrouter.ai/api/v1"></label>
      <label>API key <input id="key" type="password" autocomplete="off" placeholder="unchanged if empty"></label>
      <button>Save provider</button>
      <small id="saved"></small>
    </form>
  </aside>
  <section id="chat">
    <div id="log"></div>
    <div id="status"></div>
    <form id="say"><textarea id="text" placeholder="Message (Enter sends, Shift+Enter for a new line)"></textarea><button>Send</button><button type="button" id="continue" title="Let the model go on, without a message">Continue</button></form>
  </section>
  <aside id="memory">
    <h2>Session</h2>
    <form id="session" class="settings">
      <label>Provider <select name="provider" id="sprovider"></select></label>
      <label>Model <input name="model"></label>
      <label>Workspace <input name="workspace" placeholder="none: no bash"></label>
      <label><input name="sandbox" type="checkbox"> bash in the sandbox</label>
      <label>Window <input name="window" type="number"></label>
      <label>Reply reserve <input name="reserve" type="number"></label>
      <label>System prompt <textarea name="system" rows="2"></textarea></label>
      <button>Save</button>
      <small id="ssaved">The rest is in the session's session_settings.json.</small>
    </form>
    <h2>Context</h2>
    <div id="stats"></div>
    <h2>Memory pyramid</h2>
    <div class="legend">Top rows merge k of the row below; bottom row is chunks of raw messages. Outlined: what the context shows. Click for its text.</div>
    <div id="pyramid" class="pyramid"></div>
    <pre id="detail">Select a memory or chunk.</pre>
  </aside>
</main>
<script>
const $ = (id) => document.getElementById(id);
let state = null, providers = [], showing = null;   // showing: the job this page follows
const current = () => decodeURIComponent(location.hash.slice(1));   // the session the page shows

// a POST as this server takes it: only its own page sends the header
const post = (body, signal) => ({ method: 'POST', headers: { 'x-connectome': '1' }, body: JSON.stringify(body), signal });

async function api(path, body) {
  const v = await (await fetch(path, body ? post(body) : {})).json();
  if (v?.error) throw new Error(v.error);
  return v;
}

// a form's submit runs `save`, then says so in `note`, or why it failed
const saves = (form, note, save) => $(form).onsubmit = async (e) => {
  e.preventDefault();
  try { await save(); $(note).textContent = 'Saved.'; } catch (err) { $(note).textContent = err.message; }
};

// an assistant's text as markdown, its line breaks kept. The HTML keeps only what markdown makes, so
// the model's text can't run code on the page or load anything (an image would tell its server what
// the page shows); its links open in a new tab. Its math and its code go in after, as KaTeX and
// highlight.js made them (keep).
let kept = [];
const keep = (html) => `\uE000${kept.push(html) - 1}\uE001`;
const markdown = (text) => {
  kept = [];
  const html = DOMPurify.sanitize(marked.parse(text, { breaks: true }), {
    ALLOWED_TAGS: ['p', 'br', 'hr', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'strong', 'em', 'del', 'code', 'pre', 'blockquote', 'ul', 'ol', 'li', 'a', 'table', 'thead', 'tbody', 'tr', 'th', 'td', 'input'],
    ALLOWED_ATTR: ['href', 'title', 'start', 'align', 'type', 'checked', 'disabled'],
  });
  return html.replace(/\uE000(\d+)\uE001/g, (_, n) => kept[n] ?? '');
};

// code in its language (a name or a file extension, as highlight.js knows them), else as plain text
const highlight = (code, lang = '') => hljs.getLanguage(lang) ? hljs.highlight(code, { language: lang, ignoreIllegals: true }).value : escape(code);
marked.use({ renderer: { code: ({ text, lang }) => keep(`<pre><code>${highlight(text, (lang ?? '').split(/\s/)[0])}</code></pre>`) } });

// math in an assistant's text: $…$ or \(…\) inline, $$…$$ or \[…\] displayed (on lines of their own,
// or within a paragraph). A $ counts only against text, and a closing one only when no digit follows
// and no backtick comes between, so prices and code stay text. KaTeX sets it in its own fonts, the same
// on every device, and can't make it run or load anything (its \href and \includegraphics are off);
// markdown() puts it in after cleaning.
const MATH = /^(?:\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\$(?=\S)((?:\\.|[^$\\\n`])+?)(?<=\S)\$(?!\d)|\\\(([\s\S]+?)\\\))/;
function tex(src) {
  const m = MATH.exec(src);
  return m ? { type: 'math', raw: m[0], tex: m[1] ?? m[2] ?? m[3] ?? m[4], display: (m[1] ?? m[2]) !== undefined } : undefined;
}
const math = (t) => keep(katex.renderToString(t.tex, { displayMode: t.display, throwOnError: false, strict: false, errorColor: 'var(--warn)' }));
marked.use({ extensions: [
  // displayed math on lines of its own, a paragraph ending before it, so no line of it starts a list
  { name: 'math', level: 'block', renderer: math,
    start: (src) => { const i = src.search(/\n(?:\$\$|\\\[)/); return i < 0 ? undefined : i + 1; },
    tokenizer: (src) => { const t = tex(src); return t?.display && /^[^\S\n]*(\n|$)/.test(src.slice(t.raw.length)) ? t : undefined; } },
  { name: 'math', level: 'inline', renderer: math, start: (src) => src.search(/\$|\\[[(]/), tokenizer: tex },
] });
DOMPurify.addHook('afterSanitizeAttributes', (node) => node.tagName === 'A' && node.setAttribute('target', '_blank'));

function escape(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

// the workspaces whose groups are folded, kept in this browser
let folded = new Set();
try { folded = new Set(JSON.parse(localStorage.getItem('folded')) || []); } catch { /* no storage here: groups start open */ }

// the sessions, grouped by workspace (those without one last); in a group, a fork under its parent
async function listSessions() {
  const all = await api('/api/sessions'), workspace = (s) => s.workspace || '';
  const group = (w) => {
    const members = all.filter((s) => workspace(s) === w), inside = (s) => members.some((m) => m.name === s.parent?.name);
    const draw = (p, depth) => members.filter((s) => (inside(s) ? s.parent.name : null) === p).map((s) => `<a href="#${s.name}" class="${s.name === current() ? 'on' : ''}" style="padding-left:${6 + depth * 14}px">${escape(s.name)} <small>${s.messages}${s.parent ? ' · from ' + s.parent.at : ''}</small></a>` + draw(s.name, depth + 1)).join('');
    const title = w ? `<b>${escape(w.split(/[\\/]/).pop())}</b> · ${members.length}<small>${escape(w)}</small>` : `<b>No workspace</b> · ${members.length}`;
    return `<details class="group" data-workspace="${escape(w)}"${folded.has(w) ? '' : ' open'}><summary>${title}</summary>${draw(null, 0)}</details>`;
  };
  $('sessions').innerHTML = [...new Set(all.map(workspace))].sort((a, b) => !a - !b || a.localeCompare(b)).map(group).join('') || '<small>No sessions yet.</small>';
}

// a group's header folds it or opens it ('toggle' doesn't bubble, so this listens as it goes down)
$('sessions').addEventListener('toggle', (e) => {
  const w = e.target.dataset.workspace;
  if (w === undefined) return;
  if (e.target.open) folded.delete(w); else folded.add(w);
  try { localStorage.setItem('folded', JSON.stringify([...folded])); } catch { /* no storage here: kept until the page reloads */ }
}, true);

// the session the page shows, and the job running in it as it goes on
async function open() {
  showing?.abort();
  try {
    state = await api(`/api/s/${current()}`);
    await showLog();
    drawMemory();
    fill();
    listSessions();
    setStatus();
    if (state.running) follow(fetch(`/api/s/${current()}/live`, { signal: (showing = new AbortController()).signal }));
  } catch (err) { setStatus(err.message, true); }
}

// the log's newest messages, up to the nth if given, their blocks drawn, the user's on the right. A
// message's line (whose it is) shows only where the speaker changes ("more" goes on), and a message of tool results
// whose results all joined their calls isn't shown at all.
async function showLog(n) {
  const messages = await api(`/api/s/${current()}/messages${n == null ? '' : `?to=${n}`}`);
  $('log').innerHTML = '';
  for (const m of messages) {
    const results = m.content.every((b) => b.type === 'tool_result'), more = m.participant === shownLast()?.dataset.who;
    $('log').insertAdjacentHTML('beforeend', `<div class="msg${results ? ' results' : ''}${more ? ' more' : ''}" data-who="${escape(m.participant)}"><div class="who">${escape(m.participant)}${results ? ' · tool results' : ''}</div><button data-fork="${m.id}">fork here</button></div>`);
    const shown = $('log').lastElementChild;
    for (const b of m.content) draw(shown, b);
    shown.hidden = results && !shown.querySelector('.tool');
  }
  $('log').scrollTop = $('log').scrollHeight;
}

// the last message the log shows
const shownLast = () => [...$('log').querySelectorAll('.msg:not([hidden])')].pop();

// how a block shows, each a bubble of its own under its message's line: text as it is (the assistant's
// as markdown), reasoning folded to its last line, a call as a card that stays open until its result
// joins it (an edit's as a diff; a call the reply is still writing as its tool and its input so far),
// anything else as a note (an image as its size)
const note = (b) => b.type === 'image' ? `[image, ${b.kb} KB]` : `[${b.type}]`;
// reasoning's last line, what its folded block shows (the end of it, when long)
const lastLine = (text) => { const line = text.trimEnd().split('\n').pop(); return line.length > 200 ? '…' + line.slice(-200) : line; };
const parts = {
  text: (b, into) => into.dataset.who === 'assistant' ? `<div class="bubble md">${markdown(b.text)}</div>` : `<div class="bubble">${escape(b.text)}</div>`,
  thinking: (b) => `<details class="thinking"><summary>Thinking<span class="last">${escape(lastLine(b.thinking))}</span></summary><div>${escape(b.thinking)}</div></details>`,
  tool_use: (b) => {
    const [head, body] = (views[b.name] ?? ((input) => [escape(b.name), `<pre>${escape(JSON.stringify(input))}</pre>`]))(b.input);
    return `<details class="tool" id="call-${escape(b.id)}" open><summary>${head}</summary>${body}</details>`;
  },
  calling: (b) => `<details class="tool" open><summary>${escape(b.name)} …</summary><pre></pre></details>`,
};

// a call's card as its tool shows it: the line it shows folded (open, all of it), and what it holds
// above the result; any other tool's, its name and its input
const views = {
  bash: (input) => [`<span class="cmd">${escape(input.command ?? '')}</span>`, ''],
  edit: (input) => [`edit ${escape(input.path ?? '')}`, diff(input)],
};

// an edit's change as a diff: the lines it takes out and puts in (all in, for a new file), colored in
// its file's language, each marked in a gutter (data-mark, then data-n: number) the page draws and a
// copy leaves out
function diff({ path = '', old = '', new: text = '' }) {
  const lines = Diff.diffLines(String(old), String(text)).flatMap((part) => {
    const [mark, kind] = part.added ? ['+', 'add'] : part.removed ? ['-', 'del'] : [' ', ''];
    return part.value.replace(/\n$/, '').split('\n').map((line) => `<div class="${kind}" data-mark="${mark}">${highlight(line, String(path).split('.').pop())}</div>`);
  });
  return `<pre class="diff">${lines.join('')}</pre>`;
}

// an edit's diff numbered from where its result says it starts (the edit tool's "at line N"; a file it
// made, 1): a line taken out by the file's old count, any other by its new
function number(diff, result) {
  const start = Number(/at line (\d+)$/.exec(result)?.[1] ?? (result.startsWith('made ') ? 1 : 0));
  let [old, now] = [start, start];
  for (const row of start ? diff.children : []) {
    row.dataset.n = row.dataset.mark === '-' ? old : now;
    if (row.dataset.mark !== '+') old++;
    if (row.dataset.mark !== '-') now++;
  }
}

// block b at the end of `into`; a tool result joins its call's card when the page shows it
function draw(into, b) {
  if (b.type === 'tool_result') return result($(`call-${b.toolUseId}`) ?? into, b);
  into.insertAdjacentHTML('beforeend', (parts[b.type] ?? ((b) => `<div class="bubble">${escape(note(b))}</div>`))(b, into));
  into.lastElementChild.dataset.kind = b.type;
}

// a tool result's text, and on its call's line its first line (shown while the card is folded), the
// card then folded unless it shows a diff; without its call on the page, a card of its own
function result(card, b) {
  const text = typeof b.content === 'string' ? b.content : b.content.map((c) => c.text ?? note(c)).join('\n');
  if (!card.matches('.tool')) {
    card.insertAdjacentHTML('beforeend', '<details class="tool" open><summary>an earlier call</summary></details>');
    card = card.lastElementChild;
  }
  card.insertAdjacentHTML('beforeend', `<pre class="${b.isError ? 'failed' : ''}">${escape(text)}</pre>`);
  card.querySelector('summary').insertAdjacentHTML('beforeend', `<span class="out"> → ${escape(text.split('\n')[0].slice(0, 100))}</span>`);
  card.classList.toggle('failed', !!b.isError);
  card.open = !!card.querySelector('.diff');
  if (card.open && !b.isError) number(card.querySelector('.diff'), text);
}

// the session form shows the session's settings, a field per input of its name
const fields = () => [...$('session').elements].filter((el) => el.name);
function fill() {
  for (const el of fields()) el[el.type === 'checkbox' ? 'checked' : 'value'] = (state.settings || {})[el.name] ?? '';
}

saves('session', 'ssaved', async () => {
  const value = (el) => el.type === 'checkbox' ? el.checked : el.type === 'number' ? Number(el.value) : el.value || null;
  state = await api(`/api/s/${current()}/settings`, Object.fromEntries(fields().map((el) => [el.name, value(el)])));
  fill();
  drawMemory();
});

function setStatus(text, warn) {
  const s = $('status');
  s.className = warn || (state && (state.refused || state.problem)) ? 'warn' : '';
  s.textContent = text || (state && (state.problem || (state.refused ? 'The summarizer refused; memory formation is stopped until surgery.' : '')));
}

function drawMemory() {
  const s = state, used = s.armed || 0, { window = 0, model = '', allow = [], config = {} } = s.settings || {};
  $('stats').innerHTML = `
    <div class="stat"><span>Last context</span><span>${Math.round(used).toLocaleString()} / ${window.toLocaleString()} tokens</span></div>
    <div class="bar"><div style="width:${Math.min(100, 100 * used / window)}%"></div></div>
    <div class="stat"><span>Messages</span><span>${s.messages}</span></div>
    <div class="stat"><span>Chunks · memories</span><span>${s.layers[0] || 0} · ${s.layers.slice(1).join(' / ') || 0}</span></div>
    <div class="stat"><span>Cost</span><span title="What the session's requests cost, as the provider reports it">${s.cost == null ? 'not reported' : '$' + s.cost.toFixed(s.cost < 1 ? 4 : 2)}</span></div>
    <div class="stat"><span>Price multiplier</span><span>${(s.multiplier || 1).toFixed(3)}</span></div>
    <div class="stat"><span>Model</span><span>${escape(model)}</span></div>
    <div class="stat"><span>Tools</span><span>${s.tools.map((t) => `<button class="chip ${allow.includes(t) ? 'on' : ''}" data-tool="${escape(t)}" title="${allow.includes(t) ? 'Always allowed. Click to ask first.' : 'Asks first. Click to always allow.'}">${escape(t)}</button>`).join('') || 'none'}</span></div>
    <div class="stat"><span>Tools and system prompt</span><span>${Math.round(s.overhead).toLocaleString()} tokens</span></div>`;
  // a row per layer, the top one first; a cell spans the chunks it covers
  const width = (n) => 100 * n / Math.max(s.layers[0] || 0, 1), shown = new Set((s.frontier || []).map(([l, p]) => `${l}/${p}`));
  const rows = s.layers.map((count, level) => {
    const span = level === 0 ? 1 : config.merge_threshold ** (level - 1), color = level === 0 ? '' : `background: var(--l${Math.min(level, 5)});`;
    const cells = Array.from({ length: count }, (_, p) => `<div class="cell ${shown.has(`${level}/${p}`) ? 'shown' : ''}" data-node="${level}/${p}" title="${level ? 'L' + level : 'chunk'} ${p}" style="left:${width(p * span)}%;width:calc(${width(span)}% - 2px);${color}"></div>`);
    return `<div class="row ${level === 0 ? 'chunks' : ''}">${cells.join('')}</div>`;
  });
  $('pyramid').innerHTML = rows.reverse().join('') || '<small class="legend">No chunks yet: everything is still in the raw tail.</small>';
}

// a tool's chip toggles whether the session always allows it
$('stats').onclick = async (e) => {
  const tool = e.target.dataset.tool, { allow } = state.settings || {};
  if (!tool || !allow) return;
  try {
    state = await api(`/api/s/${current()}/settings`, { allow: allow.includes(tool) ? allow.filter((t) => t !== tool) : [...allow, tool] });
    drawMemory();
  } catch (err) { setStatus(err.message, true); }
};

$('pyramid').onclick = async (e) => {
  const node = e.target.dataset.node;
  if (!node) return;
  const [level, p] = node.split('/').map(Number);
  const [record] = await api(`/api/s/${current()}/layer/${level}?from=${p}&to=${p + 1}`);
  $('detail').textContent = level === 0
    ? `Chunk ${p}: messages ${record.first}–${record.last}, ~${Math.round(record.raw)} tokens raw`
    : `L${level} memory ${p} (messages ${record.first}–${record.last}, ${record.tokens} tokens)\n\n${record.text}`;
};

// a message's fork button forks the session there; a call's buttons answer whether it may run
$('log').onclick = async (e) => {
  const { fork: at, answer } = e.target.dataset, card = e.target.closest('.tool');
  try {
    const name = at && prompt(`Name for a fork of ${current()} at message #${at}`, `${current()}-${at}`);
    if (name) { await api(`/api/s/${current()}/fork`, { at: Number(at), name }); location.hash = name; }
    if (!answer) return;
    e.target.parentElement.remove();
    setStatus(answer === 'deny' ? 'Denied.' : 'Running…');
    await api(`/api/s/${current()}/approve`, { id: card.id.slice('call-'.length), answer });
  } catch (err) { setStatus(err.message, true); }
};

$('say').onsubmit = (e) => {
  e.preventDefault();
  const text = $('text').value.trim();
  if (text) { $('text').value = ''; turn(text); }
};

$('continue').onclick = () => turn(null);

// a turn: `text` joins the log and the model answers it, or without text the model goes on from the log as it is
function turn(text) {
  if (!current()) return;
  showing?.abort();
  showing = new AbortController();
  follow(fetch(`/api/s/${current()}/${text ? 'say' : 'continue'}`, post({ text }, showing.signal)));
}

// a job as it streams, JSON lines: {"logged": n} each time the log grows (the page shows it, then what
// it doesn't hold yet below it), {"thinking"} or {"text"} for each piece of a reply, {"calling"} as it
// starts a call and {"input"} for each piece of the call's input, then for each call
// the logged reply makes {"approve"} when it asks to run, {"answered"} once a page answers and its
// {"result"}; {"cost"}, the session's, after each request the provider prices; {"forming"} as memories start and stop forming; {"ok"} or {"error"} when the turn ends,
// and the stream once its memories have formed; then the session as the job leaves it. Opening a
// session stops it showing.
async function follow(response) {
  setStatus('Waiting for the model…');
  let error = null;
  try {
    const reader = (await response).body.pipeThrough(new TextDecoderStream()).getReader();
    let buffered = '';
    // a run of reasoning or of text continues the streaming reply's last part
    const part = (kind) => {
      if ($('reply').lastElementChild.dataset.kind !== kind) draw($('reply'), { type: kind, [kind]: '' });
      return $('reply').lastElementChild;
    };
    const take = async (line) => {
      if (!line.trim()) return;
      const event = JSON.parse(line);
      if (event.logged != null) {
        await showLog(event.logged);
        const more = shownLast()?.dataset.who === 'assistant' ? ' more' : '';
        $('log').insertAdjacentHTML('beforeend', `<div class="msg${more}" id="reply" data-who="assistant"><div class="who">assistant</div></div>`);
      }
      if (event.thinking) {   // the reasoning so far, its block showing its last line
        const thinking = part('thinking');
        thinking.lastElementChild.textContent += event.thinking;
        thinking.querySelector('.last').textContent = lastLine(thinking.lastElementChild.textContent);
      }
      if (event.cost != null) {   // the session's cost so far
        state.cost = event.cost;
        drawMemory();
      }
      if (event.calling) draw($('reply'), { type: 'calling', name: event.calling });
      if (event.input) $('reply').lastElementChild.lastElementChild.textContent += event.input;
      if (event.text) {   // the reply's markdown so far, drawn again
        const text = part('text');
        text.innerHTML = markdown(text.source = (text.source ?? '') + event.text);
      }
      if (event.approve) $(`call-${event.approve}`).insertAdjacentHTML('beforeend', '<div class="ask"><button data-answer="allow">Allow</button><button data-answer="always">Always allow</button><button data-answer="deny">Deny</button></div>');
      if (event.answered) $(`call-${event.answered}`).querySelector('.ask')?.remove();
      if (event.result) draw($('reply'), event.result);
      if (event.ok || event.error) {   // the turn has ended: the log as it leaves it, while its memories form
        error = event.error ?? null;
        await showLog();
      }
      setStatus(event.approve ? 'Waiting for you to allow or deny the call…' : event.forming ? 'Forming memories…' : '');
      $('log').scrollTop = $('log').scrollHeight;
    };
    for (let read; !(read = await reader.read()).done;) {
      const lines = (buffered + read.value).split('\n');
      buffered = lines.pop();
      for (const line of lines) await take(line);
    }
    await take(buffered);
  } catch (err) {
    if (err.name === 'AbortError') return;
    error = err.message;
  }
  await open();
  if (error) setStatus(error, true);
}

// the providers sessions choose from, each a base URL and a key the page never sees; a click on one edits it
async function loadProviders() {
  ({ providers } = await api('/api/settings'));
  $('providers').innerHTML = providers.map((p) => `<div class="provider" data-provider="${escape(p.name)}"><b>${escape(p.name)}</b>${p.key ? '' : ' · no key'}<small>${escape(p.base)}</small></div>`).join('');
  $('sprovider').innerHTML = providers.map((p) => `<option>${escape(p.name)}</option>`).join('');
  if (state) fill();
  $('saved').textContent = providers.some((p) => p.key) ? '' : 'Add a provider\'s API key to chat. DeepSeek: https://api.deepseek.com/anthropic, OpenRouter: https://openrouter.ai/api/v1';
}

$('providers').onclick = (e) => {
  const p = providers.find((p) => p.name === e.target.closest('[data-provider]')?.dataset.provider);
  if (p) [$('pname').value, $('base').value, $('key').value] = [p.name, p.base, ''];
};

saves('provider', 'saved', async () => {
  await api('/api/settings', { name: $('pname').value, base: $('base').value, key: $('key').value });
  await loadProviders();
  $('key').value = '';
});

$('text').onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('say').requestSubmit(); } };

$('create').onsubmit = async (e) => {
  e.preventDefault();
  try {
    await api('/api/sessions', { name: $('newname').value.trim(), workspace: $('newspace').value.trim() || null });
    location.hash = $('newname').value.trim();
    $('newname').value = $('newspace').value = '';
  } catch (err) { alert(err.message); }
};


window.onhashchange = () => current() && open();
loadProviders();
listSessions().then(() => window.onhashchange());
</script>
</body>
