<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connectome</title>
<style>
:root {
  --bg: #f7f6f3; --panel: #ffffff; --ink: #1d1c1a; --muted: #6b6862; --line: #e3e0da;
  --accent: #2f6fdf; --tail: #2f9e6a; --raw: #8a8780; --warn: #c2410c;
  --l1: #c9dcfb; --l2: #a5c4f6; --l3: #7ea8ee; --l4: #5a8de4; --l5: #3d72d6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161615; --panel: #1f1f1d; --ink: #ecebe7; --muted: #9a978f; --line: #33322f;
    --accent: #6b9cf5; --tail: #4cc38a; --raw: #8f8c85; --warn: #f97316;
    --l1: #23375c; --l2: #2b4778; --l3: #345a97; --l4: #3f6db5; --l5: #4b82d4;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, sans-serif; }
main { display: grid; grid-template-columns: 220px 1fr 360px; height: 100vh; }
aside, section { overflow: auto; padding: 16px; }
aside { border-right: 1px solid var(--line); }
#memory { border-left: 1px solid var(--line); border-right: 0; }
h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
button, input, textarea, select { font: inherit; color: inherit; }
button { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button:hover { border-color: var(--accent); }
input, textarea, select { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
input[type=checkbox] { width: auto; }
#sessions a { display: block; padding: 4px 6px; border-radius: 6px; color: inherit; text-decoration: none; }
#sessions a.on { background: var(--panel); outline: 1px solid var(--line); }
#sessions small { color: var(--muted); }
.group { margin: 0 0 6px; }
.group summary, .provider { cursor: pointer; padding: 4px 0; }
.group summary small, .provider small { display: block; font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }
.settings { display: flex; flex-direction: column; gap: 6px; padding: 0; border: 0; }
.settings label { font-size: 12px; color: var(--muted); }
.settings small { color: var(--muted); font-size: 12px; }
#chat { display: flex; flex-direction: column; padding: 0; }
#log { flex: 1; overflow: auto; padding: 16px; }
.msg { position: relative; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--raw); border-radius: 6px; padding: 8px 10px; margin: 0 0 8px; white-space: pre-wrap; word-wrap: break-word; }
.msg.tail { border-left-color: var(--tail); }
.msg.recalled { opacity: .55; }
.msg .who { font-size: 12px; color: var(--muted); }
.thinking { color: var(--muted); font-style: italic; margin: 2px 0 6px; }
.thinking summary { cursor: pointer; font-style: normal; font-size: 12px; }
.tool { border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; margin: 4px 0; }
.tool summary { cursor: pointer; font-size: 12px; color: var(--muted); }
.tool pre { white-space: pre-wrap; font: 12px/1.4 ui-monospace, monospace; margin: 4px 0; }
.tool.failed summary, .tool pre.failed { color: var(--warn); }
.ask { display: flex; gap: 6px; margin: 4px 0 6px; }
.chip { font-size: 12px; padding: 0 6px; margin-left: 4px; color: var(--muted); }
.chip.on { border-color: var(--tail); color: var(--tail); }
.msg > button { position: absolute; top: 6px; right: 6px; font-size: 12px; padding: 1px 6px; display: none; }
.msg:hover > button { display: block; }
form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
form textarea { resize: vertical; min-height: 42px; }
#status { color: var(--muted); font-size: 12px; padding: 0 16px 8px; min-height: 18px; }
#status.warn { color: var(--warn); }
.pyramid { display: flex; flex-direction: column; gap: 3px; margin: 8px 0 12px; }
.row { position: relative; height: 18px; }
.cell { position: absolute; top: 0; bottom: 0; border-radius: 3px; border: 1px solid transparent; cursor: pointer; min-width: 2px; }
.cell.shown { border-color: var(--ink); }
.row.chunks .cell { background: var(--raw); opacity: .5; }
.row.chunks .cell.shown { opacity: 1; }
.legend { font-size: 12px; color: var(--muted); }
.stat { display: flex; justify-content: space-between; font-size: 13px; padding: 2px 0; }
.bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 4px 0 12px; }
.bar div { height: 100%; background: var(--accent); }
pre#detail { white-space: pre-wrap; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px; font: 12px/1.4 ui-monospace, monospace; max-height: 40vh; overflow: auto; }
@media (max-width: 900px) {
  main { grid-template-columns: 1fr; height: auto; }
  aside, section { padding: 16px; }
  #chat { height: 80vh; }
}
</style>
</head>
<body>
<main>
  <aside>
    <h2>Sessions</h2>
    <div id="sessions"></div>
    <form id="create" class="settings" style="padding: 12px 0;">
      <input id="newname" placeholder="new session name">
      <input id="newspace" placeholder="its workspace, where bash runs">
      <button>Create</button>
    </form>
    <h2>Providers</h2>
    <div id="providers"></div>
    <form id="provider" class="settings">
      <label>Name <input id="pname" placeholder="openrouter"></label>
      <label>Base URL <input id="base" placeholder="https://openrouter.ai/api/v1"></label>
      <label>API key <input id="key" type="password" autocomplete="off" placeholder="unchanged if empty"></label>
      <button>Save provider</button>
      <small id="saved"></small>
    </form>
  </aside>
  <section id="chat">
    <div id="log"></div>
    <div id="status"></div>
    <form id="say"><textarea id="text" placeholder="Message (Enter sends, Shift+Enter for a new line)"></textarea><button>Send</button><button type="button" id="continue" title="Let the model go on, without a message">Continue</button></form>
  </section>
  <aside id="memory">
    <h2>Session</h2>
    <form id="session" class="settings">
      <label>Provider <select name="provider" id="sprovider"></select></label>
      <label>Model <input name="model"></label>
      <label>Workspace <input name="workspace" placeholder="none: no bash"></label>
      <label><input name="sandbox" type="checkbox"> bash in the sandbox</label>
      <label>Window <input name="window" type="number"></label>
      <label>Reply reserve <input name="reserve" type="number"></label>
      <label>System prompt <textarea name="system" rows="2"></textarea></label>
      <button>Save</button>
      <small id="ssaved">The rest is in the session's session_settings.json.</small>
    </form>
    <h2>Context</h2>
    <div id="stats"></div>
    <h2>Memory pyramid</h2>
    <div class="legend">Top rows merge k of the row below; bottom row is chunks of raw messages. Outlined: what the context shows. Click for its text.</div>
    <div id="pyramid" class="pyramid"></div>
    <pre id="detail">Select a memory or chunk.</pre>
  </aside>
</main>
<script>
const $ = (id) => document.getElementById(id);
let current = null, state = null, poll = null, providers = [], showing = null;   // showing: the turn this page follows

async function api(path, body) {
  const r = await fetch(path, body ? { method: 'POST', headers: { 'x-connectome': '1' }, body: JSON.stringify(body) } : {});
  const v = await r.json();
  if (v && v.error) throw new Error(v.error);
  return v;
}

function escape(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

// the workspaces whose groups are folded, kept in this browser
let folded = new Set();
try { folded = new Set(JSON.parse(localStorage.getItem('folded')) || []); } catch { /* no storage here: groups start open */ }

// the sessions, grouped by workspace (those without one last); in a group, a fork under its parent
async function listSessions() {
  const all = await api('/api/sessions'), workspace = (s) => s.workspace || '';
  const group = (w) => {
    const members = all.filter((s) => workspace(s) === w), inside = (s) => members.some((m) => m.name === s.parent?.name);
    const draw = (p, depth) => members.filter((s) => (inside(s) ? s.parent.name : null) === p).map((s) => `<a href="#${s.name}" class="${s.name === current ? 'on' : ''}" style="padding-left:${6 + depth * 14}px">${escape(s.name)} <small>${s.messages}${s.parent ? ' · from ' + s.parent.at : ''}</small></a>` + draw(s.name, depth + 1)).join('');
    const title = w ? `<b>${escape(w.split(/[\\/]/).pop())}</b> · ${members.length}<small>${escape(w)}</small>` : `<b>No workspace</b> · ${members.length}`;
    return `<details class="group" data-workspace="${escape(w)}"${folded.has(w) ? '' : ' open'}><summary>${title}</summary>${draw(null, 0)}</details>`;
  };
  $('sessions').innerHTML = [...new Set(all.map(workspace))].sort((a, b) => !a - !b || a.localeCompare(b)).map(group).join('') || '<small>No sessions yet.</small>';
}

// a group's header folds it or opens it ('toggle' doesn't bubble, so this listens as it goes down)
$('sessions').addEventListener('toggle', (e) => {
  const w = e.target.dataset.workspace;
  if (w === undefined) return;
  if (e.target.open) folded.delete(w); else folded.add(w);
  try { localStorage.setItem('folded', JSON.stringify([...folded])); } catch { /* no storage here: kept until the page reloads */ }
}, true);

async function open(name) {
  showing?.abort();
  current = name;
  state = await api(`/api/s/${name}`);
  await showLog();
  drawMemory();
  fill();
  listSessions();
  setStatus();
  if (state.running) follow(fetch(`/api/s/${name}/live`, { signal: (showing = new AbortController()).signal }));
}

// the log's newest messages, up to the nth if given, each as the context shows it: in the raw tail,
// in a raw chunk, or recalled through a memory
async function showLog(n) {
  const messages = await api(`/api/s/${current}/messages${n == null ? '' : `?to=${n}`}`);
  const thinking = (m) => m.thinking ? `<details class="thinking"><summary>Thinking</summary>${escape(m.thinking)}</details>` : '';
  $('log').innerHTML = messages.map((m) => `<div class="msg ${m.shown}"><div class="who">#${m.id} · ${escape(m.participant)}</div>${thinking(m)}${escape(m.text)}<button data-fork="${m.id}">fork here</button></div>`).join('');
  $('log').scrollTop = $('log').scrollHeight;
}

// the session form shows the session's settings, a field per input of its name
const fields = () => [...$('session').elements].filter((el) => el.name);
function fill() {
  for (const el of fields()) el[el.type === 'checkbox' ? 'checked' : 'value'] = (state.settings || {})[el.name] ?? '';
}

$('session').onsubmit = async (e) => {
  e.preventDefault();
  const value = (el) => el.type === 'checkbox' ? el.checked : el.type === 'number' ? Number(el.value) : el.value || null;
  try {
    state = await api(`/api/s/${current}/settings`, Object.fromEntries(fields().map((el) => [el.name, value(el)])));
    fill();
    drawMemory();
    $('ssaved').textContent = 'Saved.';
  } catch (err) { $('ssaved').textContent = err.message; }
};

function setStatus(text, warn) {
  const s = $('status');
  s.className = warn || (state && (state.refused || state.problem)) ? 'warn' : '';
  s.textContent = text || (state && (state.problem || (state.refused ? 'The summarizer refused; memory formation is stopped until surgery.' : state.forming ? 'Forming memories…' : '')));
}

function drawMemory() {
  const s = state, used = s.armed || 0, { window = 0, model = '' } = s.settings || {};
  $('stats').innerHTML = `
    <div class="stat"><span>Last context</span><span>${Math.round(used).toLocaleString()} / ${window.toLocaleString()} tokens</span></div>
    <div class="bar"><div style="width:${Math.min(100, 100 * used / window)}%"></div></div>
    <div class="stat"><span>Messages</span><span>${s.messages}</span></div>
    <div class="stat"><span>Chunks · memories</span><span>${s.layers[0] || 0} · ${s.layers.slice(1).join(' / ') || 0}</span></div>
    <div class="stat"><span>Price multiplier</span><span>${(s.multiplier || 1).toFixed(3)}</span></div>
    <div class="stat"><span>Model</span><span>${escape(model)}</span></div>
    <div class="stat"><span>Tools</span><span>${s.tools.map((t) => `<button class="chip ${t.allowed ? 'on' : ''}" data-tool="${escape(t.name)}" title="${t.allowed ? 'Always allowed. Click to ask first.' : 'Asks first. Click to always allow.'}">${escape(t.name)}</button>`).join('') || 'none'}</span></div>
    <div class="stat"><span>Tools and system prompt</span><span>${Math.round(s.overhead).toLocaleString()} tokens</span></div>`;
  const chunks = s.layers[0] || 0, shown = new Set((s.frontier || []).map(([l, p]) => `${l}/${p}`));
  const rows = [];
  for (let level = s.layers.length - 1; level >= 0; level--) {
    const span = level === 0 ? 1 : s.k ** (level - 1), cells = [];
    for (let p = 0; p < s.layers[level]; p++) {
      const left = 100 * p * span / Math.max(chunks, 1), width = 100 * span / Math.max(chunks, 1);
      const color = level === 0 ? '' : `background: var(--l${Math.min(level, 5)});`;
      cells.push(`<div class="cell ${shown.has(`${level}/${p}`) ? 'shown' : ''}" data-node="${level}/${p}" title="${level ? 'L' + level : 'chunk'} ${p}" style="left:${left}%;width:calc(${width}% - 2px);${color}"></div>`);
    }
    rows.push(`<div class="row ${level === 0 ? 'chunks' : ''}">${cells.join('')}</div>`);
  }
  $('pyramid').innerHTML = rows.join('') || '<small class="legend">No chunks yet: everything is still in the raw tail.</small>';
}

// a tool's chip toggles whether the session always allows it
$('stats').onclick = async (e) => {
  const tool = e.target.dataset.tool;
  if (!tool) return;
  const allow = state.tools.filter((t) => t.allowed !== (t.name === tool)).map((t) => t.name);
  try { state = await api(`/api/s/${current}/settings`, { allow }); drawMemory(); } catch (err) { setStatus(err.message, true); }
};

$('pyramid').onclick = async (e) => {
  const node = e.target.dataset.node;
  if (!node) return;
  const [level, p] = node.split('/').map(Number);
  const [record] = await api(`/api/s/${current}/layer/${level}?from=${p}&to=${p + 1}`);
  $('detail').textContent = level === 0
    ? `Chunk ${p}: messages ${record.first}–${record.last}, ~${Math.round(record.raw)} tokens raw`
    : `L${level} memory ${p} (messages ${record.first}–${record.last}, ${record.tokens} tokens)\n\n${record.text}`;
};

// a message's fork button forks the session there; a call's buttons answer whether it may run
$('log').onclick = async (e) => {
  const { fork: at, answer } = e.target.dataset, card = e.target.closest('.tool');
  try {
    const name = at && prompt(`Name for a fork of ${current} at message #${at}`, `${current}-${at}`);
    if (name) { await api(`/api/s/${current}/fork`, { at: Number(at), name }); location.hash = name; }
    if (!answer) return;
    e.target.parentElement.remove();
    setStatus(answer === 'deny' ? 'Denied.' : 'Running…');
    await api(`/api/s/${current}/approve`, { id: card.id.slice('call-'.length), answer });
  } catch (err) { setStatus(err.message, true); }
};

$('say').onsubmit = (e) => {
  e.preventDefault();
  const text = $('text').value.trim();
  if (!text) return;
  $('text').value = '';
  turn(text);
};

$('continue').onclick = () => turn(null);

// a turn: `text` joins the log and the model answers it, or without text the model goes on from the log as it is
function turn(text) {
  if (!current) return;
  showing?.abort();
  showing = new AbortController();
  follow(fetch(`/api/s/${current}/${text ? 'say' : 'continue'}`, { method: 'POST', headers: { 'x-connectome': '1' }, body: JSON.stringify({ text }), signal: showing.signal }));
}

// a turn as it streams, JSON lines: {"logged": n} each time the log grows (the page shows it, then what
// it doesn't hold yet below it), {"thinking"} or {"text"} for each piece of a reply, {"tool"} for each
// call, {"approve"} when it asks to run and {"answered"} once a page answers, {"result"} for its result,
// then {"ok"} or {"error"}; then the session as the turn leaves it. Opening a session stops it showing.
async function follow(response) {
  setStatus('Waiting for the model…');
  let error = null;
  try {
    const reader = (await response).body.getReader(), decoder = new TextDecoder();
    let buffered = '';
    // the reply's parts in order: a run of reasoning or of text continues its part; each call is a card
    const part = (kind, html) => {
      const reply = $('reply');
      if (reply.lastElementChild.dataset.kind !== kind || kind === 'tool') {
        reply.insertAdjacentHTML('beforeend', html);
        reply.lastElementChild.dataset.kind = kind;
      }
      return reply.lastElementChild;
    };
    const take = async (line) => {
      if (!line.trim()) return;
      const event = JSON.parse(line);
      if (event.logged != null) {
        await showLog(event.logged);
        $('log').insertAdjacentHTML('beforeend', '<div class="msg tail" id="reply"><div class="who">assistant</div></div>');
      }
      if (event.thinking) part('thinking', '<details class="thinking" open><summary>Thinking</summary><span></span></details>').lastElementChild.textContent += event.thinking;
      if (event.text) part('text', '<div></div>').textContent += event.text;
      if (event.tool) part('tool', `<details class="tool" open><summary>${escape(event.tool.name)}</summary><pre>${escape(JSON.stringify(event.tool.input))}</pre></details>`).id = `call-${event.tool.id}`;
      if (event.approve) $(`call-${event.approve}`).insertAdjacentHTML('beforeend', '<div class="ask"><button data-answer="allow">Allow</button><button data-answer="always">Always allow</button><button data-answer="deny">Deny</button></div>');
      if (event.answered) $(`call-${event.answered}`).querySelector('.ask')?.remove();
      if (event.result) {
        const card = $(`call-${event.result.id}`);
        card.insertAdjacentHTML('beforeend', `<pre class="${event.result.error ? 'failed' : ''}">${escape(event.result.text)}</pre>`);
        card.querySelector('summary').textContent += ` → ${event.result.text.split('\n')[0].slice(0, 100)}`;
        card.classList.toggle('failed', event.result.error);
        card.open = false;
      }
      if (event.error) error = event.error;
      setStatus(event.approve ? 'Waiting for you to allow or deny the call…' : '');
      $('log').scrollTop = $('log').scrollHeight;
    };
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buffered += decoder.decode(value, { stream: true });
      for (let i; (i = buffered.indexOf('\n')) >= 0; buffered = buffered.slice(i + 1)) await take(buffered.slice(0, i));
    }
    await take(buffered);
  } catch (err) {
    if (err.name === 'AbortError') return;
    error = err.message;
  }
  await open(current);
  if (error) setStatus(error, true); else watch();
}

// the providers sessions choose from, each a base URL and a key the page never sees; a click on one edits it
async function loadProviders() {
  ({ providers } = await api('/api/settings'));
  $('providers').innerHTML = providers.map((p) => `<div class="provider" data-provider="${escape(p.name)}"><b>${escape(p.name)}</b>${p.key ? '' : ' · no key'}<small>${escape(p.base)}</small></div>`).join('');
  $('sprovider').innerHTML = providers.map((p) => `<option>${escape(p.name)}</option>`).join('');
  if (state) fill();
  $('saved').textContent = providers.some((p) => p.key) ? '' : 'Add a provider\'s API key to chat. DeepSeek: https://api.deepseek.com/anthropic, OpenRouter: https://openrouter.ai/api/v1';
}

$('providers').onclick = (e) => {
  const p = providers.find((p) => p.name === e.target.closest('[data-provider]')?.dataset.provider);
  if (p) [$('pname').value, $('base').value, $('key').value] = [p.name, p.base, ''];
};

$('provider').onsubmit = async (e) => {
  e.preventDefault();
  try {
    await api('/api/settings', { name: $('pname').value, base: $('base').value, key: $('key').value });
    await loadProviders();
    $('key').value = '';
    $('saved').textContent = 'Saved.';
  } catch (err) { $('saved').textContent = err.message; }
};

$('text').onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('say').requestSubmit(); } };

$('create').onsubmit = async (e) => {
  e.preventDefault();
  try {
    await api('/api/sessions', { name: $('newname').value.trim(), workspace: $('newspace').value.trim() || null });
    location.hash = $('newname').value.trim();
    $('newname').value = $('newspace').value = '';
  } catch (err) { alert(err.message); }
};

// While memories form, the page checks back for them.
function watch() {
  clearInterval(poll);
  poll = setInterval(async () => {
    state = await api(`/api/s/${current}`);
    drawMemory();
    setStatus();
    if (!state.forming) { clearInterval(poll); open(current); }
  }, 1500);
}

window.onhashchange = () => location.hash.length > 1 && open(decodeURIComponent(location.hash.slice(1)));
loadProviders();
listSessions().then(() => window.onhashchange());
</script>
</body>
</html>
